<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · Een zone apart regelen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<link rel="stylesheet" href="zones.css">
<style>
  /*
   * Een zone apart regelen op de telefoon (schets, 12 november 2026), bij
   * Wand-Zones. Standen: (zonder) de woonkamer met per zone een regel, #zone
   * het blad van de keuken van onderen.
   */
  body { margin: 0; width: 390px; min-height: 844px; }
  .tel .tabs { position: fixed; }
  .boven { padding: 14px 18px 0; }
  .pad { font-size: 13px; color: var(--zacht); font-weight: 600; }
  .groot { display: flex; gap: 22px; margin-top: 10px; }
  .groot b { display: block; font-family: var(--kop); font-size: 42px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .groot span { font-size: 14px; font-weight: 700; color: var(--zacht); }
  .groot small { display: block; font-size: 12.5px; color: var(--gedempt); }
  .podium { height: 250px; }
  .inhoud { padding: 0 14px 120px; display: flex; flex-direction: column; gap: 10px; }
  .dek { position: fixed; inset: 0; z-index: 8; background: rgba(4, 9, 18, 0.55); }
  .blad { position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; max-height: 90%; overflow: auto; padding: 18px 18px 26px; border-radius: 26px 26px 0 0; background: #0e1828; border: 1px solid var(--glas-rand); display: flex; flex-direction: column; gap: 12px; }
  .blad .zvraag { flex-direction: column; align-items: stretch; }
  .blad .zdoel { width: 140px; height: 140px; }
</style>
</head>
<body class="lucht lucht-avond">
<div class="tel">
  <div class="boven">
    <div class="pad">Huis › Begane grond › Woonkamer</div>
    <div class="groot"><div><b>20,6°</b><span>Zithoek</span><small>verwarmt naar 21°</small></div><div><b style="color: var(--zacht)">18,9°</b><span>Keuken</span><small>uit tot 17:00</small></div></div>
  </div>
  <div class="podium" id="podium"></div>
  <div class="inhoud" id="inhoud"></div>
  <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
</div>
<script src="../../frontend/kit/iconen.js"></script>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script src="../../frontend/kit/huis.js"></script>
<script src="zones.js"></script>
<script>
  nav.tabs(document.getElementById('tabs'), 'thuis');
  const m = zonesSchets.model();
  huis.teken(document.getElementById('podium'), { ...m, etages: m.etages.map((e) => ({ ...e, kamers: e.kamers.map((k) => ({ ...k, stil: k.naam !== 'Woonkamer' })) })) }, { breedte: 390, hoogte: 250, marge: 0.03, zoom: 1.1 });
  // Het blad van de kamer, zonder de kop: die staat er al boven.
  const blad = zonesSchets.kamerBlad();
  document.getElementById('inhoud').innerHTML = blad.slice(blad.indexOf('<h3'));
  if (location.hash === '#zone') document.body.insertAdjacentHTML('beforeend', `<div class="dek"></div><section class="blad">${zonesSchets.zoneBlad()}</section>`);
</script>
</body>
</html>
