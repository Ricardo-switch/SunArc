<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · Klimaat › Meten en regeling (schets)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<link rel="stylesheet" href="zon-verdelen.css">
<link rel="stylesheet" href="klimaat-meten.css">
<style>
  /* Klimaat › Meten en regeling op de telefoon (schets, 25 november 2026): dezelfde lijst, de regeling onder de naam. */
  html, body { height: auto; }
  body { margin: 0; width: 390px; overflow: auto; }
  .tel { padding: 54px 16px 100px; display: flex; flex-direction: column; gap: 12px; }
  .terug { font-size: 14px; font-weight: 700; color: var(--zacht); }
  h1 { margin: 4px 0 0; font-family: var(--kop); font-size: 30px; font-weight: 600; line-height: 1.08; }
  .tel > p { margin: 0; font-size: 13.5px; color: var(--zacht); line-height: 1.45; }
</style>
</head>
<body class="lucht lucht-dag">
<div class="tel">
  <span class="terug">‹ Klimaat</span>
  <h1>Meten en regeling</h1>
  <p>Waarmee elke kamer zijn temperatuur meet, en wie hem regelt. Tik op een kamer om het te veranderen.</p>
  <div data-km style="display: flex; flex-direction: column; gap: 10px"></div>
</div>
<script src="../../frontend/kit/iconen.js"></script>
<script src="klimaat-meten.js"></script>
<script>
  klimaatMeten.teken(document.querySelector('[data-km]'), 'tel');
  addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
