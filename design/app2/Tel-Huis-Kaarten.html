<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tel · Je huis wat de kaarten vinden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<link rel="stylesheet" href="../../frontend/kit/huistekenen.css">
<style>
  /*
   * Je huis › Vorm: wat de kaarten vinden (schets, 20 november 2026, stap 4
   * punt 3, ronde 2). De inhoud in kaarten-schets.js. Standen: (zonder) de
   * kaarten zoeken, #gevonden, #straat, #gebouw, #buitenland.
   */
  .tel { padding: 14px 16px 110px; display: flex; flex-direction: column; gap: 12px; }
  .tk-kop { display: flex; align-items: center; gap: 8px; }
  .tk-kop a { font-size: 14px; font-weight: 600; color: var(--zacht); }
  .tk-kop h1 { margin: 0; font: 600 30px var(--kop); letter-spacing: -0.02em; }
  .tk-kop .hm-rechts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .hm-seg { display: grid; grid-template-columns: repeat(4, 1fr); }
  .hm-seg button { justify-content: center; padding: 0 2px; font-size: 13.5px; }
  .tk-etages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: rgb(255 255 255 / 0.05); }
  .tk-etages button { height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--zacht); font: 700 13.5px var(--romp); }
  .tk-etages button[aria-pressed='true'] { background: rgb(111 211 255 / 0.2); color: var(--tekst); box-shadow: inset 0 0 0 2px rgb(111 211 255 / 0.7); }
  .tk-podium { position: relative; padding: 6px; border-radius: 22px; }
  .tk-tekening { position: relative; height: 348px; }
  .tk-tekening svg { position: absolute; inset: 0; }
  .hm-straat { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 2px; color: rgb(255 255 255 / 0.3); pointer-events: none; }
  .hm-uitleg { padding: 0 4px; font-size: 13px; min-height: 54px; align-items: flex-start; }
  .ht-strook { flex-wrap: wrap; }
  .ht-strook .ht-n span { max-width: none; }
  .tk-blad { padding: 16px 14px; border-radius: 22px; }
  .ht-keus button span { height: 96px; }
  .tk-etages { grid-template-columns: repeat(4, 1fr); }
  .tk-tekening { height: 440px; }
  .hb-vraag { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px; border-radius: 18px; background: rgb(11 20 36 / 0.92); border: 1px solid rgb(247 181 72 / 0.45); }
  .hb-vraag[hidden] { display: none; }
  .hb-ik { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: rgb(247 181 72 / 0.14); color: var(--zon); flex: none; }
  .hb-ik svg { width: 20px; height: 20px; }
  .hb-tekst { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hb-tekst b { font-size: 14.5px; }
  .hb-tekst span { font-size: 12.5px; color: var(--zacht); line-height: 1.35; }
  .hb-knoppen { display: flex; gap: 8px; flex-basis: 100%; }
  .hb-knoppen button { flex: 1; height: 42px; border-radius: 12px; font: 700 14px var(--romp); border: 1px solid var(--glas-rand); background: rgb(255 255 255 / 0.08); color: var(--tekst); }
  .hb-knoppen .hb-hoofd { background: #6fd3ff; color: #0b1424; border-color: transparent; }
  /* De dakkapel: de twee kanten met een doorsnede, de maten met min en plus. */
  .dk-kanten { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .dk-kant { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px 9px; border-radius: 14px; border: 2px solid rgb(255 255 255 / 0.08); background: rgb(255 255 255 / 0.04); color: var(--tekst); font-family: var(--romp); cursor: pointer; }
  .dk-kant b { font-size: 14px; margin-top: 4px; }
  .dk-kant small { font-size: 11.5px; color: var(--gedempt); }
  .dk-kant.aan { border-color: #6fd3ff; background: rgb(111 211 255 / 0.12); }
  .dk-door { display: flex; justify-content: center; padding: 6px 0 2px; border-radius: 14px; background: rgb(255 255 255 / 0.035); }
  .dk-stap { display: grid; grid-template-columns: 1fr 40px 64px 40px; align-items: center; gap: 6px; min-height: 46px; padding: 3px 6px 3px 12px; border-radius: 14px; background: rgb(255 255 255 / 0.055); font-size: 14.5px; font-weight: 600; }
  .dk-stap button { height: 36px; border-radius: 10px; border: 0; background: rgb(255 255 255 / 0.09); color: var(--tekst); font: 700 18px var(--romp); cursor: pointer; }
  .dk-stap b { text-align: center; font-variant-numeric: tabular-nums; }
  .dk-knoppen { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .dk-knoppen .knop { height: 40px; }
  .tk-tekening { height: 400px; }
  .hm-seg { display: grid; grid-template-columns: repeat(5, 1fr); }
  .hm-seg button { padding: 0 4px; justify-content: center; font-size: 14px; }
  .hb-vraag { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: rgb(11 20 36 / 0.92); border: 1px solid rgb(247 181 72 / 0.45); }

  /* Wat voor huis: vijf soorten met een huisje, de kanten tegen de buren. */
  .wn-soorten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .wn-soort { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 4px 8px; border-radius: 14px; border: 2px solid rgb(255 255 255 / 0.08); background: rgb(255 255 255 / 0.04); color: var(--tekst); font-family: var(--romp); cursor: pointer; }
  .wn-soort b { font-size: 12.5px; margin-top: 3px; text-align: center; line-height: 1.2; }
  .wn-soort small { font-size: 11px; color: var(--gedempt); text-align: center; }
  .wn-soort i { position: absolute; top: -8px; right: 6px; padding: 1px 7px; border-radius: 999px; background: #0b1424; border: 1px dashed #6fd3ff; font: 700 10px var(--romp); font-style: normal; color: #a9e6ff; }
  .wn-soort.aan { border-color: #6fd3ff; background: rgb(111 211 255 / 0.12); }
  .ht-twee.drie { grid-template-columns: repeat(3, 1fr); }
  .wn-gebouw { display: flex; flex-direction: column; gap: 3px; padding: 8px; border-radius: 14px; background: rgb(255 255 255 / 0.04); border: 1px dashed rgb(255 255 255 / 0.16); }
  .wn-gebouw span { display: flex; flex-direction: column; justify-content: center; min-height: 34px; padding: 4px 10px; border-radius: 10px; background: rgb(255 255 255 / 0.05); font-size: 12px; font-weight: 600; color: var(--gedempt); }
  .wn-gebouw span.jij { min-height: 74px; background: rgb(111 211 255 / 0.16); box-shadow: inset 0 0 0 2px #6fd3ff; color: var(--tekst); }
  .wn-gebouw span.jij b { font-size: 14px; }
  .wn-gebouw span.jij small { font-size: 11.5px; color: #a9e6ff; }
  .hm-links .ht-laag.buiten { margin-top: 10px; }
  #tekening { width: 100%; height: 100%; }
  /* Ronde 2: wat de kaarten vinden (kaarten-schets.js). */
  @keyframes kv-draai { to { transform: rotate(360deg); } }
  .kv-draai { width: 22px; height: 22px; flex: none; animation: kv-draai 1s linear infinite; }
  .kv-zwaai { animation: kv-draai 3.2s linear infinite; }
  .kv-wacht { display: flex; flex-direction: column; gap: 6px; opacity: 0.34; filter: saturate(0.5); pointer-events: none; }
  .kv-stil { opacity: 0.45; pointer-events: none; }
  .kv-zoek { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; border: 1px solid rgb(111 211 255 / 0.55); background: rgb(111 211 255 / 0.09); }
  .kv-zoekkop { display: flex; align-items: center; gap: 10px; }
  .kv-zoekkop .kv-draai { width: 28px; height: 28px; }
  .kv-zoekkop span { display: flex; flex-direction: column; }
  .kv-zoekkop b { font-size: 15px; }
  .kv-zoekkop small { font-size: 12px; color: var(--zacht); }
  .kv-stappen { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .kv-stappen li { display: flex; align-items: center; gap: 10px; }
  .kv-stappen li > span:last-child { display: flex; flex-direction: column; min-width: 0; }
  .kv-stappen b { font-size: 13.5px; }
  .kv-stappen small { font-size: 11.5px; color: var(--gedempt); }
  .kv-st { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px dashed rgb(255 255 255 / 0.25); }
  .kv-st svg { width: 15px; height: 15px; }
  .kv-klaar .kv-st { border: 0; background: rgb(110 231 183 / 0.2); color: #6ee7b7; }
  .kv-bezig .kv-st { border: 0; }
  .kv-bezig .kv-st .kv-draai { width: 24px; height: 24px; }
  .kv-nog b { color: var(--gedempt); }
  .kv-pil { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px 0 10px; border-radius: 999px; background: rgb(11 20 36 / 0.9); border: 1px solid rgb(111 211 255 / 0.55); font-size: 13.5px; font-weight: 700; color: #a9e6ff; white-space: nowrap; }
  .kv-straat { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 16px; border: 2px solid rgb(255 255 255 / 0.08); background: rgb(255 255 255 / 0.04); color: var(--tekst); font-family: var(--romp); text-align: left; cursor: pointer; }
  .kv-straat span { display: flex; flex-direction: column; }
  .kv-straat b { font-size: 14.5px; }
  .kv-straat small { font-size: 12px; color: var(--zacht); }
  .kv-straat i { position: absolute; top: -8px; right: 10px; padding: 1px 8px; border-radius: 999px; background: #0b1424; border: 1px dashed #6ee7b7; font: 700 10px var(--romp); font-style: normal; color: #b6f0d6; }
  .kv-straat.aan { border-color: #6ee7b7; background: rgb(110 231 183 / 0.1); }
  .kv-vier { grid-template-columns: repeat(4, 1fr); }
  .kv-stap { display: grid; grid-template-columns: minmax(0, 1fr) 40px 70px 40px; align-items: center; gap: 6px; min-height: 48px; padding: 3px 6px 3px 12px; border-radius: 14px; background: rgb(255 255 255 / 0.055); }
  .kv-stap span { display: flex; flex-direction: column; font-size: 14.5px; font-weight: 600; }
  .kv-stap span i { font-style: normal; font-size: 11px; font-weight: 600; color: var(--gedempt); }
  .kv-stap button { height: 36px; border-radius: 10px; border: 0; background: rgb(255 255 255 / 0.09); color: var(--tekst); font: 700 18px var(--romp); cursor: pointer; }
  .kv-stap b { text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; }
  .kv-weet { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 40px; padding: 4px 12px; border-radius: 12px; background: rgb(255 255 255 / 0.05); }
  .kv-weet span { font-size: 13px; color: var(--zacht); }
  .kv-weet b { font-size: 14.5px; }
  .kv-weet i { font-style: normal; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px dashed rgb(110 231 183 / 0.6); color: #b6f0d6; }
  .kv-weet.mist { border: 1px dashed rgb(247 181 72 / 0.7); background: rgb(247 181 72 / 0.07); }
  .kv-weet.mist i { border-color: rgb(247 181 72 / 0.7); color: #ffd38a; }
  .ht-bron:disabled { opacity: 0.5; cursor: default; }
  .ht-blad { display: flex; flex-direction: column; gap: 7px; }
</style>
</head>
<body class="lucht lucht-dag">
<div class="tel">
  <div class="tk-kop">
    <div><a>‹ Instellingen</a><h1>Je huis</h1></div>
    <div class="hm-rechts">
      <span class="hm-bewaard" id="bewaard">Bewaard</span>
      <button type="button" class="hm-rond" id="terug" aria-label="Stap terug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button type="button" class="hm-rond" id="vooruit" aria-label="Stap vooruit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
  </div>
  <div class="hm-seg" id="standen" role="group" aria-label="Wat je tekent">
    <button type="button" data-stand="vorm">Vorm</button>
    <button type="button" data-stand="dak">Dak</button>
    <button type="button" data-stand="kamers">Kamers</button>
    <button type="button" data-stand="apparaten">Apparaten</button>
<button type="button" data-stand="huis">Huis</button>
  </div>
  <div class="tk-etages" role="group" aria-label="Etage">
    <button type="button">Zolder</button>
    <button type="button">1e</button>
    <button type="button" aria-pressed="true">Begane grond</button>
    <button type="button">Buiten</button>
  </div>
  <div class="hb-vraag" id="vraag" hidden></div>
  <section class="glas tk-podium">
    <div class="tk-tekening"><svg id="tekening" role="application" aria-label="De plattegrond van deze etage"></svg><span class="hm-straat">STRAAT</span></div>
  </section>
  <p class="hm-uitleg" id="uitleg"></p>
  <div class="ht-strook" id="strook" hidden></div>
  <aside class="glas tk-blad ht-blad" id="blad" aria-live="polite"></aside>
  <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
</div>
<script>try { localStorage.setItem('sc-taal', 'nl'); } catch (e) {}</script>
<script src="../../frontend/kit/iconen.js"></script>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script src="kaarten-schets.js"></script>
<script>
  nav.tabs(document.getElementById('tabs'), 'instellingen');
  kaartenSchets.start(true);
</script>
</body>
</html>
