<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · Auto en laden: één ingang (schets)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  /*
   * Auto en laden: één ingang, op de telefoon (schets bij Wand-Laden-Toevoegen,
   * 19 november 2026). Zoals Toevoegen op de telefoon: de soort, wat SunArc
   * vond, het blad van onderen. Onderaan de lijst de twee wegen als hij er
   * niet bij staat. Standen: #auto (de lijst), #blad (een laadpaal
   * klaarzetten), #losse (uit losse sensoren).
   */
  .tel { position: relative; overflow: hidden; }
  .inhoud { padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 10px; }
  .terug { font-size: 13px; font-weight: 700; color: var(--zacht); }
  .lead { margin: 0; font-size: 13.5px; color: var(--zacht); }
  h4 { margin: 8px 4px 2px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gedempt); }
  .groep { padding: 6px; display: flex; flex-direction: column; }
  .vond { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 52px; padding: 7px 10px; border-radius: 14px; }
  .vond + .vond { border-top: 1px solid rgba(255, 255, 255, 0.05); }
  .ik { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.07); color: var(--zacht); }
  .ik.open { background: transparent; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); font-size: 19px; font-weight: 700; }
  .ik svg { width: 21px; height: 21px; }
  .vond b { display: block; font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vond small { display: block; font-size: 12.5px; color: var(--gedempt); }
  small.nieuw { color: var(--gloed-t); }
  .r { color: var(--gedempt); font-size: 17px; }
  .r.klaar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: rgba(110, 231, 183, 0.18); color: var(--mint); }
  .tabs { position: fixed; left: 12px; right: 12px; bottom: 14px; }
  .achter { position: fixed; inset: 0; background: rgba(4, 8, 16, 0.6); z-index: 60; }
  .blad { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88%; overflow: hidden; padding: 18px 18px 22px; border-radius: 26px 26px 0 0; display: flex; flex-direction: column; gap: 10px; background: #0e1726; border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 61; }
  .blad .greep { width: 40px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); align-self: center; margin-top: -6px; }
  .blad h2 { margin: 0; font-family: var(--kop); font-size: 23px; font-weight: 600; }
  .blad .nu { margin: 2px 0 0; font-size: 13.5px; color: var(--zacht); }
  .vraag > b { display: block; margin: 0 0 6px; font-size: 13.5px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { height: 36px; padding: 0 13px; border-radius: 999px; display: inline-flex; align-items: center; background: rgba(255, 255, 255, 0.07); font-size: 14px; font-weight: 600; color: var(--zacht); }
  .chips span.aan { background: var(--tekst); color: var(--inkt); }
  .rij { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .rij .l { flex: 1; min-width: 0; }
  .rij .l b { display: block; font-size: 15px; font-weight: 600; }
  .rij .l span { font-size: 12.5px; color: var(--gedempt); }
  .schakel { position: relative; flex: none; width: 46px; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); }
  .schakel::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #c9d3dc; }
  .schakel.aan { background: var(--mint); }
  .schakel.aan::after { left: 21px; background: #fff; }
  .zet { height: 50px; border-radius: 16px; border: 0; background: var(--tekst); color: var(--inkt); font: inherit; font-weight: 700; font-size: 16px; }
  .verberg { height: 44px; border: 0; background: transparent; color: var(--zacht); font: inherit; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .verberg svg { width: 18px; height: 18px; }
  .invoer { height: 44px; border-radius: 13px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); display: flex; align-items: center; padding: 0 14px; font-size: 15px; }
  .sens { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .sens i { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.3); display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 800; }
  .sens i.aan { background: var(--mint); box-shadow: none; color: var(--inkt); }
  .sens b { display: block; font-size: 14px; font-weight: 600; }
  .sens small { font-size: 11.5px; color: var(--gedempt); }
  .sens em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--zacht); }
  .klein { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gedempt); margin-top: 4px; }
</style>
</head>
<body>
<div class="tel lucht lucht-dag">
  <div class="inhoud" data-inhoud></div>
  <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
</div>
<script src="../../frontend/kit/iconen.js"></script>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script>localStorage.setItem('sc-taal', 'nl');</script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script>
  const stand = location.hash.slice(1) || 'auto';
  if (nav.tabs) nav.tabs(document.getElementById('tabs'), 'apparaten');
  const ik = (naam) => iconen.svg(naam);
  const vond = ([icoon, naam, zin], klaar, open = false) => `<div class="vond"><span class="ik${open ? ' open' : ''}">${icoon.length > 2 ? ik(icoon) : icoon}</span><div><b>${naam}</b><small class="${klaar || open ? '' : 'nieuw'}">${zin}</small></div>${klaar ? '<span class="r klaar">✓</span>' : '<span class="r">›</span>'}</div>`;

  const lijst = `<span class="terug">‹ Toevoegen</span><h1 class="kop-1">Auto en laden</h1><p class="lead">Je auto en je laadpaal, uit Home Assistant.</p>
    <h4 style="color: var(--gloed-t)">Nieuw · nog niet klaar</h4><section class="glas groep">${vond(['laadpaal', 'Easee Home', 'Laadpaal · nog niet klaar'])}</section>
    <h4>Al klaar · staat bij Apparaten</h4><section class="glas groep">${vond(['auto', 'ID.3', 'Auto · laadt aan Easee Home'], true)}</section>
    <h4>Staat hij er niet bij?</h4><section class="glas groep">${vond(['+', 'Zelf een apparaat kiezen', 'Uit alles wat Home Assistant kent'], false, true)}${vond(['laadpaal', 'Uit losse sensoren', 'Een laadpaal via Modbus'], false, true)}${vond(['verborgen', 'Verborgen', 'Niets verborgen'], false, true)}</section>`;
  const vraag = (titel, keuzes) => `<div class="vraag"><b>${titel}</b><div class="chips">${keuzes.map((x) => `<span class="${x.endsWith('*') ? 'aan' : ''}">${x.replace('*', '')}</span>`).join('')}</div></div>`;
  const blad = `<div class="achter"></div><div class="blad"><span class="greep"></span>
    <div><h2>Easee Home</h2><p class="nu">Laadpaal · 6 tot 16 A, 3 fasen</p></div>
    ${vraag('Waar staat hij?', ['Oprit*', 'Carport', 'Garage'])}
    ${vraag('Welke auto laadt hier?', ['ID.3*', 'Geen auto in Home Assistant'])}
    <div class="rij"><div class="l"><b>Met de hand</b><span>SunArc mag de laadstroom zetten en pauzeren als jij dat vraagt</span></div><span class="schakel aan"></span></div>
    <button class="zet" type="button">Zet klaar</button>
    <button class="verberg" type="button">${ik('verborgen')}Verbergen: geen laadpaal van dit huis</button></div>`;
  const losse = `<div class="achter"></div><div class="blad"><span class="greep"></span>
    <div><h2>Uit losse sensoren</h2><p class="nu">Een laadpaal die in Home Assistant geen apparaat is, zoals via Modbus.</p></div>
    <div class="vraag"><b>Naam</b><div class="invoer">Laadpaal oprit</div></div>
    <div class="klein">Vermogen nu</div>
    <div class="sens"><i class="aan">✓</i><div><b>Laadpaal vermogen</b><small>sensor.modbus_laadpaal_vermogen</small></div><em>0 W</em></div>
    <div class="klein">Stroom</div>
    <div class="sens"><i class="aan">✓</i><div><b>Laadpaal stroom L1</b><small>sensor.modbus_laadpaal_stroom_l1</small></div><em>0,0 A</em></div>
    <button class="zet" type="button">Zet klaar</button></div>`;

  document.querySelector('[data-inhoud]').innerHTML = lijst;
  if (stand === 'blad') document.querySelector('.tel').insertAdjacentHTML('beforeend', blad);
  if (stand === 'losse') document.querySelector('.tel').insertAdjacentHTML('beforeend', losse);
</script>
</body>
</html>
