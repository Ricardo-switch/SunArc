<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · De ene standpagina (schets)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  /*
   * De ene standpagina op de telefoon (schets stap 2, 17 november 2026), bij
   * Wand-Stand-Een: onder elkaar wat eerst moet, de waaier, de weg naar zelf
   * regelen, wat er nog bij kan en elke functie met zijn stand.
   *   (geen hash)  het huis van Ricardo
   *   #nieuw       een nieuw huis
   */
  body { margin: 0; width: 390px; }
  .tel { padding: 54px 16px 100px; display: flex; flex-direction: column; gap: 12px; }
  .terug { font-size: 15px; font-weight: 700; color: var(--zacht); }
  .kop-1 { font-size: 34px; }
  .tellers { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--zacht); }
  .tellers span { display: flex; align-items: center; gap: 6px; }
  .tellers b { color: var(--tekst); }
  .eerst { padding: 12px 14px; border-radius: 18px; background: rgba(255, 122, 77, 0.08); border: 1px solid rgba(255, 122, 77, 0.35); display: flex; flex-direction: column; gap: 8px; }
  .eerst b { font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .eerst .stip { background: var(--gloed); }
  .eerst span.zin { font-size: 13px; color: var(--zacht); line-height: 1.4; }
  .knopje { align-self: flex-start; flex: none; height: 34px; padding: 0 14px; border-radius: 11px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; background: var(--tekst); color: var(--inkt); white-space: nowrap; }
  .knopje.zacht { background: rgba(247, 181, 72, 0.12); color: var(--zon-t); border: 1px solid rgba(247, 181, 72, 0.4); height: 32px; font-size: 12.5px; padding: 0 10px; }
  .waaier { width: 358px; height: auto; margin: 8px 0 0; }
  h4 { margin: 6px 4px -4px; font-size: 12.5px; font-weight: 700; color: var(--gedempt); }
  .groep { padding: 4px 12px; border-radius: 18px; }
  .func { display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid var(--glas-rand); font-size: 14.5px; }
  .func:first-child { border-top: 0; }
  .func .naam { flex: 1; min-width: 0; }
  .func .naam span { display: block; font-size: 12px; color: var(--gedempt); }
  .stand { flex: none; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
  .stand .stip { width: 7px; height: 7px; }
  .weg { padding: 14px; border-radius: 18px; display: flex; flex-direction: column; gap: 10px; }
  .weg h3 { margin: 0; font-family: var(--kop); font-size: 18px; font-weight: 600; }
  .weg p { margin: 0; font-size: 13px; color: var(--gedempt); line-height: 1.4; }
  .halte { display: grid; grid-template-columns: 22px 1fr; gap: 0 10px; position: relative; padding-bottom: 10px; }
  .halte::before { content: ''; position: absolute; left: 9px; top: 20px; bottom: -2px; width: 3px; background: rgb(var(--wit) / 0.14); }
  .halte.klaar::before { background: var(--mint); }
  .halte:last-of-type::before { display: none; }
  .halte i { width: 20px; height: 20px; border-radius: 50%; background: rgb(var(--wit) / 0.2); border: 3px solid rgb(var(--nacht)); grid-row: 1 / 3; }
  .halte.klaar i { background: var(--mint); }
  .halte.nu i { background: #fff; }
  .halte.doel i { background: var(--zon); }
  .halte b { font-size: 14px; }
  .halte.doel b { color: var(--zon-t); }
  .halte span { font-size: 12.5px; color: var(--gedempt); }
  .maat { display: grid; grid-template-columns: 1fr 80px 60px; gap: 10px; align-items: center; font-size: 13px; color: var(--zacht); }
  .maat .meter { height: 6px; border-radius: 6px; background: rgb(var(--wit) / 0.1); overflow: hidden; }
  .maat .meter i { display: block; height: 100%; background: var(--mint); }
  .maat b { text-align: right; color: var(--tekst); }
</style>
</head>
<body>
<div class="tel lucht lucht-avond" id="scherm"></div>
<script src="../../frontend/kit/iconen.js"></script>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script src="../../frontend/kit/waaier.js"></script>
<script src="voortgang-voorbeeld.js"></script>
<script src="stand-een.js"></script>
<script>
  const { EERST, KAN_ERBIJ, WEG } = standEen;
  const huis = location.hash.slice(1) === 'nieuw' ? 'nieuw' : 'jouw';
  const KL = { werkt: 'var(--mint)', kijkt: 'var(--ijs)', leert: 'var(--violet)' };
  const TK = { werkt: 'var(--mint-t)', kijkt: 'var(--ijs-t)', leert: 'var(--violet-t)' };
  const korte = { leert: 'Wat het huis eerst leert' };
  const w = WEG[huis];
  const scherm = document.getElementById('scherm');
  scherm.innerHTML = `
    <span class="terug">‹ Instellingen</span>
    <h1 class="kop-1">Wat je huis kan</h1>
    <div class="tellers">${['werkt', 'kijkt', 'leert'].map((s) => `<span><i class="stip" style="background: ${KL[s]}"></i>${LABEL[s]} <b>${tel(s)}</b></span>`).join('')}<span><i class="stip" style="background: var(--zon)"></i>Kan erbij <b>${KAN_ERBIJ.length}</b></span></div>
    ${EERST.map((e) => `<div class="eerst"><b><i class="stip"></i>Eerst dit: ${e.titel}</b><span class="zin">${e.zin}</span><span class="knopje">${e.knop} ›</span></div>`).join('')}
    <svg class="waaier" viewBox="0 0 740 440" data-waaier></svg>
    <div class="glas weg"><h3>${w.kop}</h3><p>${w.zin}</p>
      <div>${w.stappen.map(([b, s, k]) => `<div class="halte ${k}"><i></i><b>${b}</b><span>${s}</span></div>`).join('')}</div>
      ${w.maten.map(([n, t, p]) => `<div class="maat">${n}<span class="meter"><i style="width: ${Math.max(3, p * 100)}%"></i></span><b>${t}</b></div>`).join('')}</div>
    <h4>Kan er nog bij</h4>
    <div class="glas groep">${KAN_ERBIJ.map(([n, z, k]) => `<div class="func"><span class="naam">${n}<span>${z}</span></span><span class="knopje zacht">${k} ›</span></div>`).join('')}</div>
    ${W_GROEPEN.map((g) => `<h4>${korte[g.id] ?? g.naam}</h4><div class="glas groep">${g.onderwerpen.map((x) => `<div class="func"><span class="naam">${x.titel}</span><span class="stand" style="color: ${TK[x.stand]}"><i class="stip" style="background: ${KL[x.stand]}"></i>${LABEL[x.stand]}</span></div>`).join('')}</div>`).join('')}`;
  window.waaier.teken(document.querySelector('[data-waaier]'), { groepen: W_GROEPEN, cx: 370, cy: 392, r0: 88, R: 238, namen: true, groepnamen: true, horizon: 140, ringen: TREDEN.map((x) => x.toLowerCase()), getal: `${TOTAAL}%`, onder: 'zo ver is je huis', groei: false });
  const tabs = document.createElement('nav');
  tabs.className = 'tabs';
  scherm.append(tabs);
  nav.tabs(tabs, 'instellingen');
</script>
</body>
</html>
