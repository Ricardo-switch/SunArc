<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · De boiler in de tekening (schets)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  /*
   * De boiler in de tekening, met zijn temperatuur en zijn stroom, op de
   * telefoon (schets, 15 november 2026). Uitleg en standen in boiler.js.
   */
  body { margin: 0; background: #0b1424; }
  .scherm { position: relative; width: 390px; height: 844px; overflow: hidden; }
  .boven { padding: 18px 18px 0; }
  .tijd { font-family: var(--kop); font-size: 34px; font-weight: 600; line-height: 1; }
  .groet { display: block; margin-top: 16px; font-size: 15px; font-weight: 600; color: var(--zacht); }
  .kop-1 { margin: 4px 0 0; font-size: 32px; }
  .lead { margin: 6px 0 0; font-size: 15px; }
  .podium { width: 390px; height: 330px; margin-top: 6px; }
</style>
</head>
<body data-scherm="tel">
  <div class="scherm lucht lucht-dag" data-lucht data-basis="scherm">
    <div class="boven">
      <span class="tijd">13:20</span>
      <span class="groet">Goedemiddag</span>
      <h1 class="kop-1" data-kop></h1>
      <p class="lead" data-zin></p>
    </div>
    <div class="podium" id="podium"></div>
  </div>
  <script src="../../frontend/kit/iconen.js"></script>
  <script src="../../frontend/kit/huis-basis.js"></script>
  <script src="../../frontend/kit/huis-kamers.js"></script>
  <script src="../../frontend/kit/huis-buiten.js"></script>
  <script src="../../frontend/kit/huis-tuin.js"></script>
  <script src="../../frontend/kit/huis-route.js"></script>
  <script src="../../frontend/kit/huis.js"></script>
  <script src="boiler.js"></script>
</body>
</html>
