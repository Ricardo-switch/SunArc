<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Wand · Het huis op echte maat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  /*
   * Het huis op echte maat (schets in de echte motor, 8 november 2026; plan na
   * besluit 288). De tekening komt uit frontend/kit/huis3d.js, met de vakken
   * uit huisvorm.js: dezelfde code die de app gaat gebruiken. Wat je ziet komt
   * uit wat Je huis bewaart: de gebouwen met hun maat, goot en nok, de etages,
   * de kamers als vakken en de plek van de apparaten.
   *
   * Keuzes van Ricardo: opengewerkt met lage binnenmuren, vanaf de straat
   * schuin van rechtsvoor, in huis.js (eerst alleen het huis, het eiland en
   * de rest blijven), eerst deze schets.
   *   (zonder)  het voorbeeldhuis: hoofdhuis met zadeldak, uitbouw en garage
   *   #jouw     het huis van Ricardo uit de 3D-kaart: nok op 3,75 m van de
   *             voorgevel, goot voor 5,6 m en achter 3,9 m, garage ernaast
   *   #avond    jouw huis 's avonds
   */
  main { position: relative; padding: 22px 26px 20px 22px; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; min-height: 0; }
  .links { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .links .klok { font-family: 'Bricolage Grotesque', sans-serif; font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .links .datum { color: var(--zacht); font-size: 16px; margin-top: -6px; }
  .links h1 { margin: 6px 0 0; font-size: 36px; line-height: 1.08; }
  .links p { margin: 0; color: var(--zacht); font-size: 15px; line-height: 1.45; }
  .bron { margin-top: auto; padding: 16px 18px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; }
  .bron h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .bron h3::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ijs); }
  .feiten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .feiten div { padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); }
  .feiten b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .feiten small { font-size: 11px; color: var(--gedempt); }
  .bron .mini { margin: 0; }
  .podium { position: relative; display: grid; place-items: center; min-height: 0; }
  .podium svg { display: block; overflow: visible; }
  .kompas { position: absolute; right: 8px; top: 6px; width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); display: grid; place-items: center; }
</style>
</head>
<body>
<div class="wand lucht lucht-dag" id="wand">
  <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
  <main>
    <div class="links">
      <div class="klok" id="klok">12:41</div>
      <div class="datum">zondag 8 november</div>
      <h1 id="kop">Het huis is op temperatuur</h1>
      <p id="lead">Getekend uit Je huis: elk gebouw op zijn maat, elke etage op zijn hoogte, elke kamer op zijn plek.</p>
      <div class="glas bron">
        <h3 id="bronkop">Uit Je huis</h3>
        <div class="feiten" id="feiten"></div>
        <p class="mini" id="bronzin"></p>
      </div>
    </div>
    <div class="podium" id="podium"><span class="kompas" id="kompas" aria-hidden="true"></span></div>
  </main>
</div>
<script src="../../frontend/kit/iconen.js"></script>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script src="../../frontend/kit/huisvorm.js"></script>
<script src="../../frontend/kit/huis3d.js"></script>
<script>
  const stand = location.hash.slice(1);
  const jouw = stand === 'jouw' || stand === 'avond';
  nav.balk(document.getElementById('balk'), 'thuis');
  if (stand === 'avond') {
    document.getElementById('wand').classList.replace('lucht-dag', 'lucht-avond');
    document.getElementById('klok').textContent = '21:12';
  }
  const ID = { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
  const op = (e, f) => ({ a: 1, b: 0, c: 0, d: 1, e, f });

  /* Het voorbeeldhuis, zoals in de schets Wand-Huis-Ontwerp: hoofdhuis, uitbouw achter, garage links. */
  const VOORBEELD = {
    beschrijving: 'Het voorbeeldhuis opengewerkt: drie etages, een uitbouw achter en een garage ernaast.',
    gebouwen: [
      { id: 'huis', soort: 'hoofdhuis', breed: 10, diep: 8.4, m: ID, dakvorm: 'zadel', nokAs: 'u', goot: 6.3, nok: 10.2 },
      { id: 'uitbouw', soort: 'uitbouw', breed: 5.8, diep: 3.2, m: op(4.2, 8.4), dakvorm: 'plat', goot: 3.1 },
      { id: 'garage', soort: 'garage', breed: 3.6, diep: 6.6, m: op(-3.6, 1.0), dakvorm: 'plat', goot: 2.9 },
    ],
    etages: [
      { id: 'bg', naam: 'Begane grond', van: 0, tot: 2.8, op: ['huis', 'uitbouw', 'garage'] },
      { id: 'e1', naam: 'Eerste verdieping', van: 2.8, tot: 5.6, op: ['huis'] },
      { id: 'zolder', naam: 'Zolder', van: 5.6, tot: 10.2, dak: true, op: ['huis'] },
    ],
    bomen: {
      bg: { huis: { as: 'u', op: 3, a: { as: 'v', op: 5.4, a: { kamer: 'hal' }, b: { naam: 'Toilet' } }, b: { kamer: 'woonkamer' } }, uitbouw: { kamer: 'keuken' }, garage: { kamer: 'garage' } },
      e1: { huis: { as: 'u', op: 4.4, a: { as: 'v', op: 4, a: { kamer: 'kinderkamer' }, b: { as: 'u', op: 1.5, a: { naam: 'Overloop' }, b: { kamer: 'badkamer' } } }, b: { kamer: 'slaapkamer' } } },
      zolder: { huis: { kamer: 'zolder' } },
    },
    kamers: {
      hal: { naam: 'Hal', soort: 'hal' },
      woonkamer: { naam: 'Woonkamer', soort: 'woonkamer', temp: '20,6°', zin: 'op temperatuur', toon: 'goed' },
      keuken: { naam: 'Keuken', soort: 'keuken', temp: '20,2°' },
      garage: { naam: 'Garage', soort: 'garage' },
      kinderkamer: { naam: 'Kinderkamer', soort: 'kinderkamer', temp: '18,9°' },
      badkamer: { naam: 'Badkamer', soort: 'badkamer', temp: '21,0°' },
      slaapkamer: { naam: 'Slaapkamer', soort: 'slaapkamer', temp: '17,8°' },
      zolder: { naam: 'Zolder', soort: 'berging', temp: '17,1°', zin: 'verwarmt op zon', toon: 'zon' },
    },
    apparaten: [
      { id: 'airco', etage: 'bg', gebouw: 'huis', u: 9.3, v: 7.8, kleur: '#6fd3ff' },
      { id: 'lamp', etage: 'bg', gebouw: 'huis', u: 6.5, v: 4.4, kleur: '#f7b548' },
      { id: 'droger', etage: 'bg', gebouw: 'uitbouw', u: 1.2, v: 2.6, kleur: '#6fd3ff' },
      { id: 'airco2', etage: 'zolder', gebouw: 'huis', u: 5, v: 7, kleur: '#6fd3ff' },
    ],
  };

  /*
   * Het huis van Ricardo, zoals het uit de 3D-kaart komt (zie Wand-Huis-Kaart):
   * de voorgevel kijkt naar het oosten; het huis is 5,6 m breed langs de straat
   * en 9,8 m diep. De garage staat links ernaast, verder naar achter.
   */
  const JOUW = {
    beschrijving: 'Het huis van boven de straat gezien, opengewerkt: de woonkamer om de hal, de keuken achter, vier kamers boven en de zolder, de garage ernaast.',
    gebouwen: [
      { id: 'huis', soort: 'hoofdhuis', breed: 5.6, diep: 9.84, m: ID, dakvorm: 'zadel', nokAs: 'u', goot: 5.6, gootAchter: 3.9, nok: 9.2, nokOp: 3.75 },
      { id: 'garage', soort: 'garage', breed: 2.6, diep: 8.9, m: op(-2.6, 7.5), dakvorm: 'plat', goot: 2.7 },
    ],
    etages: [
      { id: 'bg', naam: 'Begane grond', van: 0, tot: 2.8, op: ['huis', 'garage'] },
      { id: 'e1', naam: 'Eerste verdieping', van: 2.8, tot: 5.6, op: ['huis'] },
      { id: 'zolder', naam: 'Zolder', van: 5.6, tot: 9.2, dak: true, op: ['huis'] },
    ],
    bomen: {
      bg: { huis: { as: 'v', op: 7.5, a: { as: 'v', op: 5.5, a: { kamer: 'woonkamer' }, b: { as: 'u', op: 2.2, a: { kamer: 'hal' }, b: { kamer: 'woonkamer' } } }, b: { kamer: 'keuken' } }, garage: { kamer: 'garage' } },
      e1: { huis: { as: 'v', op: 3.45, a: { as: 'u', op: 2.9, a: { kamer: 'badkamer' }, b: { kamer: 'hobby' } }, b: { as: 'u', op: 2.9, a: { kamer: 'slaapkamer' }, b: { kamer: 'slaap2' } } } },
      zolder: { huis: { kamer: 'zolder' } },
    },
    kamers: {
      woonkamer: { naam: 'Woonkamer', soort: 'woonkamer', temp: stand === 'avond' ? '20,4°' : '20,6°', zin: 'goed', toon: 'goed' },
      hal: { naam: 'Hal', soort: 'hal' },
      keuken: { naam: 'Keuken', soort: 'keuken', temp: '20,2°' },
      garage: { naam: 'Garage', soort: 'garage' },
      badkamer: { naam: 'Badkamer', soort: 'badkamer', temp: stand === 'avond' ? '21,0°' : '18,4°' },
      hobby: { naam: 'Hobbykamer', soort: 'werkkamer' },
      slaapkamer: { naam: 'Slaapkamer', soort: 'slaapkamer', temp: '17,8°' },
      slaap2: { naam: 'Slaapkamer 2', soort: 'slaapkamer' },
      zolder: { naam: 'Zolder', soort: 'berging', temp: stand === 'avond' ? '19,2°' : '17,1°', zin: stand === 'avond' ? 'verwarmt op de airco' : 'verwarmt op zon', toon: stand === 'avond' ? 'verwarmt' : 'zon' },
    },
    apparaten: [
      { id: 'airco-wk', etage: 'bg', gebouw: 'huis', u: 5.3, v: 4.6, kleur: '#6fd3ff' },
      { id: 'airco-z', etage: 'zolder', gebouw: 'huis', u: 2.8, v: 5.2, kleur: '#6fd3ff' },
      { id: 'nest', etage: 'bg', gebouw: 'huis', u: 0.4, v: 3, kleur: '#ff9a6b' },
    ],
  };

  const model = jouw ? JOUW : VOORBEELD;
  const el = document.getElementById('podium');
  const maat = { breedte: Math.round(el.clientWidth), hoogte: Math.round(el.clientHeight) };
  el.insertAdjacentHTML('afterbegin', huis3d.teken(model, { ...maat, zon: stand === 'avond' ? [-0.6, -0.5, 0.2] : [0.45, -0.7, 0.55] }));

  const hoofd = model.gebouwen[0];
  const nl1 = (n) => n.toLocaleString('nl-NL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  document.getElementById('feiten').innerHTML = [
    [`${nl1(hoofd.breed)} × ${nl1(hoofd.diep)} m`, 'het huis'],
    [`${nl1(hoofd.goot)} m`, hoofd.gootAchter ? `goot voor (achter ${nl1(hoofd.gootAchter)})` : 'tot de goot'],
    [`${nl1(hoofd.nok)} m`, 'tot de nok'],
    [String(model.etages.length), 'etages'],
    [String(Object.keys(model.kamers).length), 'kamers'],
    [String(model.gebouwen.length), 'gebouwen'],
  ].map(([b, s]) => `<div><b>${b}</b><small>${s}</small></div>`).join('');
  document.getElementById('bronkop').textContent = jouw ? 'Uit de 3D-kaart en Je huis' : 'Uit Je huis';
  document.getElementById('bronzin').textContent = jouw
    ? 'Omtrek, goot en nok uit de 3D-kaart van Nederland; de kamers en etages zoals in Je huis. Het dak loopt voor steiler af dan achter.'
    : 'Het voorbeeldhuis: de vorm bij Huisontwerp, de hoogtes bij Etages, de vakken bij Kamers.';
  document.getElementById('kompas').innerHTML = `<svg viewBox="-12 -12 24 24" width="30" height="30" style="transform: rotate(${jouw ? -90 + 32 : 180 + 32}deg)"><path d="M0 -9 L4 4 L0 1.5 L-4 4Z" fill="#ff7a4d"/><text y="10.5" text-anchor="middle" font-size="5" font-weight="700" fill="#b8c4cf" font-family="Figtree">N</text></svg>`;
</script>
</body>
</html>
