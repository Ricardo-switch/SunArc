<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Wand · Energie › De zon verdelen (schets)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<link rel="stylesheet" href="zon-verdelen.css">
<style>
  /*
   * Energie › De zon verdelen (schets, 24 november 2026, stap 4 punt 7, issue 137). Een eigen deel bij Energie, naast
   * Zonnepanelen: bovenaan wat er nu over is en wie het krijgt, links de ene lijst om te slepen, rechts de marge voor
   * het hele huis en hoe het op Thuis in de strook staat. Op zon bij Klimaat › Voorrang verhuist hierheen; daar blijft
   * de volgorde van de kamers bij koelen en verwarmen. De inhoud: zon-verdelen.js.
   *   (zonder)  middag, 2,4 kW over      #weinig  bewolkt, 0,5 kW over
   */
  main { position: relative; padding: 18px 26px 18px 22px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .boven .terug { font-size: 14px; font-weight: 700; color: var(--zacht); display: block; margin-bottom: 4px; }
  .boven { display: flex; align-items: flex-end; gap: 16px; }
  .boven .bewaard { margin-left: auto; margin-bottom: 8px; font-size: 13.5px; font-weight: 600; color: var(--gedempt); }
  .veld { flex: 1; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 14px; min-height: 0; }
  .delen { align-self: start; padding: 6px; border-radius: 22px; display: flex; flex-direction: column; gap: 2px; }
  .deel { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 1px 12px; align-items: center; min-height: 58px; padding: 6px 12px; border-radius: 16px; }
  .deel .ik { grid-row: 1 / 3; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); }
  .deel .ik svg { width: 20px; height: 20px; }
  .deel b { font-size: 15.5px; font-weight: 600; align-self: end; }
  .deel small { font-size: 12.5px; color: var(--gedempt); align-self: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deel.nu { background: rgb(var(--wit) / 0.1); }
  .deel.nieuw b::after { content: 'nieuw'; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--zon-t); background: rgb(var(--zon-k) / 0.14); padding: 2px 7px; border-radius: 999px; vertical-align: 2px; }
  .vorm { padding: 16px 20px; border-radius: 24px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .vormkop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .vormkop h2 { margin: 0; }
  .vormkop span { font-size: 13px; color: var(--gedempt); }
</style>
</head>
<body>
<div class="wand lucht lucht-dag">
  <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
  <main>
    <div class="boven">
      <div><span class="terug">‹ Instellingen</span><h1 class="kop-1">Energie</h1></div>
      <span class="bewaard">Alles wordt meteen bewaard</span>
    </div>
    <div class="veld">
      <nav class="glas delen" aria-label="Delen van Energie">
        <div class="deel"><span class="ik" data-ik="zon" style="color: var(--zon)"></span><b>Zonnepanelen</b><small>2 vlakken, 4,7 kWp</small></div>
        <div class="deel nu nieuw"><span class="ik" data-ik="opzon" style="color: var(--zon)"></span><b>De zon verdelen</b><small>6 in de lijst</small></div>
        <div class="deel"><span class="ik" data-ik="aansluiting" style="color: var(--ijs)"></span><b>Aansluiting</b><small>3 × 25 A</small></div>
        <div class="deel"><span class="ik" data-ik="meter" style="color: var(--mint)"></span><b>Meters</b><small>stroom, gas, 4 apparaten</small></div>
        <div class="deel"><span class="ik" data-ik="prijzen" style="color: var(--zon)"></span><b>Contract en prijzen</b><small>prijs per uur</small></div>
        <div class="deel"><span class="ik" data-ik="verwarming" style="color: var(--violet)"></span><b>Verwarming</b><small>cv-ketel</small></div>
      </nav>
      <section class="glas vorm">
        <div class="vormkop"><h2 class="kop-2">De zon verdelen</h2><span>SunArc kijkt mee: het laat zien wat het zou doen</span></div>
        <div data-zv style="display: flex; flex-direction: column; gap: 12px; min-height: 0"></div>
      </section>
    </div>
  </main>
</div>
<script src="../../frontend/kit/iconen.js"></script>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script src="zon-verdelen.js"></script>
<script>
  nav.balk(document.getElementById('balk'), 'instellingen');
  document.querySelectorAll('[data-ik]').forEach((el) => (el.innerHTML = iconen.svg(el.dataset.ik)));
  zonVerdelen.teken(document.querySelector('[data-zv]'), 'wand');
</script>
</body>
</html>
