<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · Klimaat per kamer in één blad (schets)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  /*
   * Klimaat per kamer op de telefoon (schets stap 2, 17 november 2026), bij
   * Wand-Klimaat-Kamer: hetzelfde blad onder elkaar. Bovenaan wat er nu
   * gebeurt, dan wat ervoor zorgt, dan hoe warm en de rest. Voorstel: wat
   * ervoor zorgt eerst, omdat het de vraag "wie regelt deze kamer" beantwoordt
   * (zoals bij de wasruimte); gekozen door Ricardo op 17 november.
   *   (geen hash)  de woonkamer
   *   #zolder      de zolder
   */
  body { margin: 0; width: 390px; }
  .tel { padding: 54px 16px 100px; display: flex; flex-direction: column; gap: 12px; }
  .terug { font-size: 15px; font-weight: 700; color: var(--zacht); }
  .kamerkop { display: flex; align-items: baseline; gap: 10px; }
  .kamerkop .kop-1 { font-size: 34px; }
  .kamerkop .getal { margin-left: auto; font-size: 28px; }
  .pilkeus { align-self: flex-start; height: 34px; padding: 0 12px; border-radius: 11px; background: rgb(var(--wit) / 0.07); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--zacht); }
  .pilkeus b { color: var(--tekst); font-weight: 600; }
  .nuzin { padding: 12px 14px; border-radius: 16px; background: rgba(111, 211, 255, 0.08); border: 1px solid rgba(111, 211, 255, 0.18); font-size: 14.5px; line-height: 1.45; }
  .nuzin .wie { display: inline-block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--ijs-t); padding: 3px 10px; border-radius: 999px; background: rgba(111, 211, 255, 0.12); }
  .nuzin .zou { color: var(--ijs-zacht); }
  h4 { margin: 8px 4px -2px; font-size: 12.5px; font-weight: 700; color: var(--gedempt); }
  .icoon { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); flex: none; color: var(--gloed); }
  .icoon svg { width: 20px; height: 20px; }

  .toestel { padding: 12px; border-radius: 18px; display: flex; flex-direction: column; gap: 10px; }
  .toestel .bovenrij { display: flex; align-items: flex-start; gap: 12px; }
  .toestel .naam b { display: block; font-size: 15px; }
  .toestel .naam span { display: block; font-size: 12.5px; color: var(--gedempt); line-height: 1.35; }
  .taak { align-self: flex-start; margin-left: 48px; height: 36px; padding: 0 12px; border-radius: 11px; background: rgb(var(--wit) / 0.08); display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; }
  .cv, .volgt { margin-left: 48px; display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; border-radius: 12px; font-size: 13px; }
  .cv { background: rgba(255, 122, 77, 0.07); border: 1px solid rgba(255, 122, 77, 0.16); }
  .cv .naam b { font-size: 13.5px; }
  .cv .naam span { font-size: 12px; color: var(--gedempt); display: block; }
  .volgt { border: 1px dashed var(--glas-rand); color: var(--zacht); display: block; }
  .volgt b { color: var(--tekst); font-weight: 600; }
  .schakel { margin-left: auto; width: 40px; height: 24px; border-radius: 999px; background: rgb(var(--wit) / 0.15); position: relative; flex: none; }
  .schakel::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .schakel.aan { background: var(--k, var(--mint)); }
  .schakel.aan::after { left: 18px; }

  .dagdeel { padding: 12px 14px; border-radius: 18px; display: flex; flex-direction: column; gap: 4px; }
  .dagdeel .kop { display: flex; align-items: baseline; gap: 10px; }
  .dagdeel .kop b { font-size: 15px; }
  .dagdeel .kop span { font-size: 12.5px; color: var(--gedempt); }
  .schuif { position: relative; height: 50px; margin: 0 10px; }
  .schuif .baan { position: absolute; left: 0; right: 0; top: 24px; height: 8px; border-radius: 8px; background: linear-gradient(90deg, rgba(255, 122, 77, 0.45), rgba(255, 255, 255, 0.08) 50%, rgba(111, 211, 255, 0.45)); }
  .schuif .baan.uit { background: rgb(var(--wit) / 0.1); }
  .schuif .goed { position: absolute; top: 24px; height: 8px; background: repeating-linear-gradient(135deg, rgba(110, 231, 183, 0.75) 0 6px, rgba(247, 181, 72, 0.6) 6px 12px); }
  .schuif .knop-s { position: absolute; top: 16px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); display: grid; place-items: center; }
  .schuif .knop-s::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
  .schuif .waarde { position: absolute; top: 41px; transform: translateX(-50%); font-size: 11.5px; color: var(--zacht); font-weight: 600; }
  .schuif .nu { position: absolute; top: -2px; transform: translateX(-50%); font-size: 10.5px; font-weight: 700; display: flex; flex-direction: column; align-items: center; white-space: nowrap; }
  .schuif .nu::after { content: ''; width: 2px; height: 6px; background: var(--tekst); margin-top: 1px; border-radius: 2px; }
  .schuif .leeg { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font-size: 11.5px; padding: 2px 10px; border-radius: 999px; background: rgb(var(--nacht) / 0.9); color: var(--zacht); }
  .schakels { display: flex; gap: 8px; margin-top: 8px; }
  .schakelregel { flex: 1; display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; border-radius: 12px; background: rgb(var(--wit) / 0.05); font-size: 13.5px; }
  .schakelregel .stip { width: 7px; height: 7px; }

  .rij { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 16px; font-size: 14px; flex-wrap: wrap; }
  .rij .naam { flex: 1; min-width: 160px; }
  .rij .naam b { display: block; font-size: 14.5px; }
  .rij .naam span { font-size: 12px; color: var(--gedempt); }
  .segment { display: flex; padding: 3px; border-radius: 11px; background: rgb(var(--nacht) / 0.5); }
  .segment span { padding: 6px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 700; color: var(--zacht); }
  .segment span.aan { background: var(--zon); color: #0b1424; }
  .stapper { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
  .stapper i { font-style: normal; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgb(var(--wit) / 0.08); }
  .rij .pijl { color: var(--gedempt); }
  .voet { margin: 0 4px; font-size: 12.5px; color: var(--gedempt); }
  .voet a { color: var(--ijs-t); font-weight: 600; }
</style>
</head>
<body>
<div class="tel lucht lucht-avond" id="scherm"></div>
<script src="../../frontend/kit/iconen.js"></script>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script src="klimaat-kamer.js"></script>
<script>
  const { KAMERS } = klimaatKamer;
  const id = location.hash.slice(1) in KAMERS ? location.hash.slice(1) : 'woonkamer';
  const k = KAMERS[id];
  const ik = (naam) => `<span class="icoon">${iconen.svg(naam)}</span>`;
  const komma = (x) => `${String(x).replace('.', ',')}°`;
  const plek = (t) => `${((t - 10) / 20) * 100}%`;
  const nuGetal = parseFloat(k.nu.replace(',', '.'));
  const schuif = (d, nu) => {
    if (!d.warmAan && !d.koelAan) return `<div class="schuif"><div class="baan uit"></div><span class="leeg">doet niets</span></div>`;
    return `<div class="schuif"><div class="baan"></div>
      <div class="goed" style="left: ${plek(d.warm)}; right: calc(100% - ${plek(d.koel)})"></div>
      ${nu != null ? `<span class="nu" style="left: ${plek(nu)}">nu ${komma(nu)}</span>` : ''}
      <span class="knop-s" style="left: ${plek(d.warm)}; --k: var(--gloed)"></span><span class="waarde" style="left: ${plek(d.warm)}">${komma(d.warm)}</span>
      <span class="knop-s" style="left: ${plek(d.koel)}; --k: var(--ijs)"></span><span class="waarde" style="left: ${plek(d.koel)}">${komma(d.koel)}</span></div>`;
  };

  const scherm = document.getElementById('scherm');
  scherm.innerHTML = `
    <span class="terug">‹ Klimaat</span>
    <div class="kamerkop"><h1 class="kop-1">${k.naam}</h1><span class="getal">${k.nu}</span></div>
    <span class="pilkeus">Gemeten met <b>${k.meten}</b> ▾</span>
    <div class="nuzin"><span class="wie">Kijkt mee</span><br>${k.zin} <span class="zou">${k.zou}</span></div>

    <h4>Wat ervoor zorgt</h4>
    ${k.zorgt.map((a) => `<div class="glas toestel">
      <div class="bovenrij">${ik(a.icoon)}<div class="naam"><b>${a.naam}</b><span>${a.zin}</span></div></div>
      ${a.volgt ? `<div class="volgt"><b>${a.volgt}</b>: ze kunnen niet apart verwarmen.</div>` : `<span class="taak">${a.taak} ▾</span>`}
      ${a.cv ? `<div class="cv"><div class="naam"><b>Helpt ook de cv</b><span>${a.cv.vandaag}</span></div><span class="schakel ${a.cv.aan ? 'aan' : ''}" style="--k: var(--gloed)"></span></div>` : ''}
    </div>`).join('')}

    <h4>Hoe warm</h4>
    ${k.dagdelen.map((d, i) => `<div class="glas dagdeel">
      <div class="kop"><b>${d.naam}</b><span>${d.tijd}</span></div>
      ${schuif(d, i === 0 ? nuGetal : null)}
      <div class="schakels">
        <span class="schakelregel"><span class="stip" style="background: var(--gloed)"></span>Verwarmen<span class="schakel ${d.warmAan ? 'aan' : ''}" style="--k: var(--gloed)"></span></span>
        <span class="schakelregel"><span class="stip" style="background: var(--ijs)"></span>Koelen<span class="schakel ${d.koelAan ? 'aan' : ''}" style="--k: var(--ijs)"></span></span>
      </div></div>`).join('')}

    <h4>Op zon, van het net en weg</h4>
    <div class="glas rij"><div class="naam"><b>Op zon mag het</b><span>verder dan je doel, om zon te bewaren</span></div><div class="segment">${['Niet', '½°', '1°', '2°'].map((x, i) => `<span class="${[0, 0.5, 1, 2][i] === k.opZon ? 'aan' : ''}">${x}</span>`).join('')}</div></div>
    <div class="glas rij"><div class="naam"><b>Koelen van het net</b><span>zonder zon alleen als het warmer wordt dan</span></div><div class="stapper"><i>−</i>${k.koelNet === 'nooit' ? 'nooit' : `boven ${k.koelNet}`}<i>+</i></div></div>
    <div class="glas rij"><div class="naam"><b>${k.afwezig[0]}</b><span>${k.afwezig[1]}</span></div><span class="pijl">›</span></div>
    <p class="voet">Wanneer een airco de cv helpt, geldt voor alle airco's: <a>Klimaat › Helpen bij de cv</a>.</p>`;

  const tabs = document.createElement('nav');
  tabs.className = 'tabs';
  scherm.append(tabs);
  nav.tabs(tabs, 'instellingen');
</script>
</body>
</html>
