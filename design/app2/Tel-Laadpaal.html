<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · De laadpaal op Thuis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<link rel="stylesheet" href="laadpaal.css">
<style>
  /*
   * De laadpaal op de telefoon (schets, 12 november 2026), bij Wand-Laadpaal.
   * Standen: (zonder) de auto laadt op zon, #net van het net, #blad het blad
   * van de paal van onderen.
   */
  body { margin: 0; width: 390px; min-height: 844px; }
  .tel .tabs { position: fixed; }
  .boven { padding: 16px 18px 0; }
  .tijd { font-family: var(--kop); font-weight: 600; font-size: 40px; letter-spacing: -0.03em; line-height: 1; }
  .boven h1 { font-family: var(--kop); font-size: 28px; font-weight: 600; margin: 10px 0 4px; letter-spacing: -0.02em; }
  .boven p { margin: 0; font-size: 14.5px; color: var(--zacht); }
  .podium { height: 380px; margin-top: 4px; }
  .regel { margin: 0 16px; padding: 12px 14px; border-radius: 18px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .regel b { display: block; font-size: 15px; }
  .regel small { font-size: 12.5px; color: var(--zacht); }
  .regel .pijl { color: var(--gedempt); font-size: 18px; }
  .dek { position: fixed; inset: 0; z-index: 8; background: rgba(4, 9, 18, 0.55); }
  .blad { position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; max-height: 88%; overflow: auto; padding: 18px 18px 26px; border-radius: 26px 26px 0 0; background: #0e1828; border: 1px solid var(--glas-rand); display: flex; flex-direction: column; gap: 12px; }
  .blad .lnu { grid-template-columns: 1fr; gap: 10px; }
</style>
</head>
<body>
<div class="tel lucht" id="lucht">
  <div class="boven"><div class="tijd" id="tijd"></div><h1 id="kop"></h1><p id="lead"></p></div>
  <div class="podium" id="podium"></div>
  <div class="glas regel"><span class="lring" style="--p: 57" id="ring"><b id="pct">57%</b></span><div><b>Elektrische auto</b><small id="autozin"></small></div><span class="pijl">›</span></div>
  <nav class="tabs" id="tabs" aria-label="Hoofdmenu"></nav>
</div>
<script src="../../frontend/kit/iconen.js"></script>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script src="../../frontend/kit/huis.js"></script>
<script src="laadpaal.js"></script>
<script>
  const hash = location.hash.slice(1);
  const net = hash === 'net';
  const s = laadpaalSchets.stand(net ? 'net' : '');
  document.getElementById('lucht').classList.add(net ? 'lucht-avond' : 'lucht-dag');
  nav.tabs(document.getElementById('tabs'), 'thuis');
  document.getElementById('tijd').textContent = s.tijd;
  document.getElementById('kop').textContent = s.kop;
  document.getElementById('lead').textContent = s.lead;
  document.getElementById('pct').textContent = net ? '64%' : '57%';
  document.getElementById('ring').style.setProperty('--p', net ? 64 : 57);
  document.getElementById('autozin').textContent = net ? 'laadt 7,4 kW van het net, vol om 22:10' : 'laadt 3,7 kW, 80% zon, vol om 16:40';
  // Op de telefoon alleen de labels die passen: de paal.
  const model = { ...s.model, etages: s.model.etages.map((e) => ({ ...e, kamers: e.kamers.map((k) => ({ ...k, stil: true })) })), labels: s.model.labels.filter((l) => l.bij === 'laadpaal').map((l) => ({ ...l, regels: l.regels.slice(0, 1), dx: 10, dy: 70 })) };
  huis.teken(document.getElementById('podium'), model, { breedte: 390, hoogte: 380, wereld: true, eigenLucht: false, marge: 0.02 });
  if (hash === 'blad') document.body.insertAdjacentHTML('beforeend', `<div class="dek"></div><section class="blad">${laadpaalSchets.blad(false)}</section>`);
</script>
</body>
</html>
