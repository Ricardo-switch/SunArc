<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wand · Je huis deuren en ramen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<link rel="stylesheet" href="../../frontend/kit/huistekenen.css">
<style>
  /*
   * Je huis › Kamers: deuren en ramen (schets, 20 november 2026). De inhoud
   * in deuren-schets.js. Standen: (zonder), #deur, #pui, #muur.
   */
  main { padding: 20px 24px 18px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }
  .hm-kop { display: flex; align-items: center; gap: 14px; height: 54px; }
  .terug { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px 0 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--glas-rand); font-size: 14.5px; font-weight: 600; color: var(--zacht); }
  .terug i { font-style: normal; font-size: 20px; line-height: 1; margin-top: -2px; }
  .hm-kop .kop-1 { font-size: 38px; margin: 0 14px 0 4px; white-space: nowrap; }
  .hm-rechts { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .hm-veld { flex: 1; display: grid; grid-template-columns: 124px minmax(0, 1fr) 306px; gap: 16px; min-height: 0; }
  .hm-links { display: flex; flex-direction: column; justify-content: center; padding: 0 8px 30px; }
  .hm-links .opnieuw { margin-top: 22px; border: 0; background: transparent; color: var(--gedempt); font: 600 12px var(--romp); text-decoration: underline; cursor: pointer; text-align: left; padding: 0 4px; }
  .hm-podium { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 8px; min-height: 0; min-width: 0; border-radius: 24px; }
  .hm-tekening { flex: 1; min-height: 0; position: relative; }
  .hm-tekening svg { position: absolute; inset: 0; }
  .hm-straat { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: rgb(255 255 255 / 0.3); pointer-events: none; }
  .hm-blad { padding: 16px 14px 14px; border-radius: 24px; min-height: 0; overflow: hidden; }
  .hb-vraag { position: absolute; left: 16px; right: 16px; top: 12px; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; background: rgb(11 20 36 / 0.92); border: 1px solid rgb(247 181 72 / 0.45); box-shadow: 0 10px 30px rgb(0 0 0 / 0.35); }
  .hb-vraag[hidden] { display: none; }
  .hb-ik { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgb(247 181 72 / 0.14); color: var(--zon); flex: none; }
  .hb-ik svg { width: 22px; height: 22px; }
  .hb-tekst { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hb-tekst b { font-size: 15px; }
  .hb-tekst span { font-size: 13px; color: var(--zacht); line-height: 1.35; }
  .hb-knoppen { display: flex; gap: 8px; flex: none; }
  .hb-knoppen button { height: 40px; padding: 0 16px; border-radius: 12px; font: 700 14px var(--romp); cursor: pointer; border: 1px solid var(--glas-rand); background: rgb(255 255 255 / 0.08); color: var(--tekst); }
  .hb-knoppen .hb-hoofd { background: #6fd3ff; color: #0b1424; border-color: transparent; }
  /* De dakkapel: de twee kanten met een doorsnede, de maten met min en plus. */
  .dk-kanten { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .dk-kant { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px 9px; border-radius: 14px; border: 2px solid rgb(255 255 255 / 0.08); background: rgb(255 255 255 / 0.04); color: var(--tekst); font-family: var(--romp); cursor: pointer; }
  .dk-kant b { font-size: 14px; margin-top: 4px; }
  .dk-kant small { font-size: 11.5px; color: var(--gedempt); }
  .dk-kant.aan { border-color: #6fd3ff; background: rgb(111 211 255 / 0.12); }
  .dk-door { display: flex; justify-content: center; padding: 6px 0 2px; border-radius: 14px; background: rgb(255 255 255 / 0.035); }
  .dk-stap { display: grid; grid-template-columns: 1fr 40px 64px 40px; align-items: center; gap: 6px; min-height: 46px; padding: 3px 6px 3px 12px; border-radius: 14px; background: rgb(255 255 255 / 0.055); font-size: 14.5px; font-weight: 600; }
  .dk-stap button { height: 36px; border-radius: 10px; border: 0; background: rgb(255 255 255 / 0.09); color: var(--tekst); font: 700 18px var(--romp); cursor: pointer; }
  .dk-stap b { text-align: center; font-variant-numeric: tabular-nums; }
  .dk-knoppen { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .dk-knoppen .knop { height: 40px; }

  /* Deuren en ramen: zes soorten met een plaatje van boven, zoals in de tekening. */
  .dr-soorten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .dr-soort { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 3px 7px; border-radius: 12px; border: 2px solid rgb(255 255 255 / 0.08); background: rgb(255 255 255 / 0.04); color: var(--tekst); font-family: var(--romp); cursor: pointer; }
  .dr-soort b { font-size: 12px; text-align: center; line-height: 1.15; margin-top: 2px; }
  .dr-soort small { font-size: 10.5px; color: var(--gedempt); }
  .dr-soort.aan { border-color: #6fd3ff; background: rgb(111 211 255 / 0.12); }
  #tekening { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="wand lucht lucht-dag">
  <nav class="balk" id="balk" aria-label="Hoofdmenu"></nav>
  <main>
    <div class="hm-kop">
      <span class="terug"><i>‹</i>Instellingen</span>
      <h1 class="kop-1">Je huis</h1>
      <div class="hm-seg" id="standen" role="group" aria-label="Wat je tekent">
        <button type="button" data-stand="vorm" data-ik="thuis">Vorm</button>
        <button type="button" data-stand="dak" data-ik="dak">Dak</button>
        <button type="button" data-stand="kamers" data-ik="kamers">Kamers</button>
        <button type="button" data-stand="apparaten" data-ik="apparaat">Apparaten</button>
<button type="button" data-stand="huis" data-ik="thuis">Huis</button>
      </div>
      <div class="hm-rechts">
        <span class="hm-bewaard" id="bewaard">Bewaard</span>
        <button type="button" class="hm-rond" id="terug" aria-label="Stap terug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button type="button" class="hm-rond" id="vooruit" aria-label="Stap vooruit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      </div>
    </div>
    <div class="hm-veld">
      <div class="hm-links">
        <div class="ht-stapel" id="stapel"><div class="ht-dak" aria-hidden="true"></div><button type="button" class="ht-laag"><b>Zolder</b><small>2 kamers</small></button><button type="button" class="ht-laag"><b>1e</b><small>4 kamers</small></button><button type="button" class="ht-laag aan" aria-pressed="true"><b>Begane grond</b><small>4 kamers</small></button><div class="ht-grond" aria-hidden="true"></div><button type="button" class="ht-laag buiten"><b>Buiten</b><small>oprit, tuin</small></button></div>
        
      </div>
      <section class="glas hm-podium">
        <div class="hb-vraag" id="vraag" hidden></div>
        <div class="hm-tekening"><svg id="tekening" role="application" aria-label="De plattegrond van deze etage"></svg><span class="hm-straat">STRAAT</span></div>
        <div class="ht-strook" id="strook" hidden></div>
        <p class="hm-uitleg" id="uitleg"></p>
      </section>
      <aside class="glas hm-blad ht-blad" id="blad" aria-live="polite"></aside>
    </div>
  </main>
</div>
<script>try { localStorage.setItem('sc-taal', 'nl'); } catch (e) {}</script>
<script src="../../frontend/kit/iconen.js"></script>
<script src="../../frontend/kit/teksten.nl.js"></script>
<script src="../../frontend/kit/teksten.en.js"></script>
<script src="../../frontend/kit/taal.js"></script>
<script src="../../frontend/kit/nav.js"></script>
<script src="deuren-schets.js"></script>
<script>
  nav.balk(document.getElementById('balk'), 'instellingen');
  deurenSchets.start(false);
</script>
</body>
</html>
