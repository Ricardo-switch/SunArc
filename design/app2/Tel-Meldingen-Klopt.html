<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon · Meldingen, wat niet klopt (schets)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../frontend/kit/kit.css">
<style>
  /*
   * Wat nu alleen in het logboek staat, als melding met een knop, op de
   * telefoon (schets, 15 november 2026). Het blad van de bel komt van onderen.
   * De inhoud en de standen staan in meldingen-klopt.js.
   */
  body { margin: 0; background: #0b1424; }
  .scherm { position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(#141a33, #0b1424); }
  .boven { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 0; opacity: 0.45; }
  .boven .tijd { font-family: var(--kop); font-size: 34px; font-weight: 600; }
  .boven .bel { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); }
  .boven .bel svg { width: 18px; height: 18px; }
  .boven .bel b { position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--gloed); color: #fff; font-size: 10.5px; display: grid; place-items: center; }
  .blad { position: absolute; left: 8px; right: 8px; bottom: 8px; max-height: 88%; padding: 12px 16px 16px; border-radius: 26px; display: flex; flex-direction: column; gap: 10px; background: rgba(12, 20, 34, 0.98); border: 1px solid var(--glas-rand); box-sizing: border-box; }
  .blad::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); margin: 0 auto 4px; flex: none; }
  .blad .kop { display: flex; justify-content: space-between; align-items: center; }
  .sluit { height: 36px; padding: 0 14px; border-radius: 12px; background: var(--ijs); color: var(--inkt); display: grid; place-items: center; font-size: 14px; font-weight: 700; }
  [data-lijst] { display: flex; flex-direction: column; gap: 10px; }
  .blad h3 { margin: 4px 0 0; font-size: 13px; font-weight: 700; color: var(--gedempt); }
  .melding { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 11px; padding: 11px 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07); }
  .melding .ik { grid-row: 1 / 4; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; }
  .melding .ik svg { width: 19px; height: 19px; }
  .melding b { font-size: 14.5px; }
  .melding p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--zacht); }
  .melding .acties { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  .melding .acties span { height: 36px; padding: 0 11px; border-radius: 11px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; background: rgba(255, 255, 255, 0.08); white-space: nowrap; }
  .melding .acties span.licht { background: var(--tekst); color: var(--inkt); }
  .melding .acties .tijd { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--gedempt); background: none; padding: 0; }
  .melding.oud { background: transparent; border-color: transparent; padding: 2px 12px; }
  .melding.oud b { font-size: 14px; font-weight: 600; color: var(--zacht); }
  .melding.oud .ik { width: 30px; height: 30px; grid-row: 1 / 3; }
  .rood { background: rgba(255, 122, 77, 0.14); color: #ffb090; }
  .geel { background: rgba(247, 181, 72, 0.14); color: var(--zon); }
  .blauw { background: rgba(111, 211, 255, 0.14); color: var(--ijs); }
  .groen { background: rgba(110, 231, 183, 0.12); color: var(--mint); }
  .paars { background: rgba(143, 134, 255, 0.14); color: var(--violet); }
</style>
</head>
<body>
  <div class="scherm">
    <div class="boven"><span class="tijd">15:20</span><span class="bel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><b data-aantal>3</b></span></div>
    <aside class="blad" aria-label="Meldingen">
      <div class="kop"><h2 class="kop-2" style="margin: 0">Meldingen</h2><span class="sluit">Klaar</span></div>
      <div data-lijst></div>
    </aside>
  </div>
  <script src="meldingen-klopt.js"></script>
</body>
</html>
