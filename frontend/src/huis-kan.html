<style>
  /*
   * Wat je huis kan: de ene standpagina (besluit 322, schets Wand-Stand-Een en
   * Tel-Stand-Een). Links de zonnewaaier en wat er nog bij kan; rechts eerst
   * wat ontbreekt en elke functie met zijn stand; onderaan de weg naar zelf
   * regelen. Een tik op een functie of een straal opent het blad.
   */
  #wand main { position: relative; display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 0; }
  .terugje { font-size: 14px; font-weight: 600; color: var(--zacht); text-decoration: none; }
  .kopregel { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .tellers { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 16px; font-size: 14px; color: var(--zacht); padding-bottom: 6px; }
  .tellers span { display: inline-flex; align-items: center; gap: 7px; }
  .tellers b { color: var(--tekst); font-family: var(--kop); font-size: 16px; }
  .stip { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* Het veld houdt de waaier, de functies en de weg; het blad ligt er rechts overheen, ook over de weg. */
  .veld { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .midden { flex: 1; min-height: 0; display: grid; grid-template-columns: 500px minmax(0, 1fr); gap: 16px; }
  .links { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .beeld { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  /* De waaier krimpt als er veel bij kan, zodat alles op de wand past. */
  .beeld svg { height: 100%; width: auto; max-width: 100%; }
  .rechts { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  /* Eerst dit: wat echt ontbreekt, met de knop erbij. */
  .eerst { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 12px 16px; border-radius: 18px; background: rgba(255, 122, 77, 0.08); border: 1px solid rgba(255, 122, 77, 0.35); }
  .eerst .regel { display: flex; align-items: center; gap: 14px; }
  .eerst .regel + .regel { padding-top: 6px; border-top: 1px solid rgba(255, 122, 77, 0.2); }
  /* Na de eerste: op één regel, zodat drie dingen samen klein blijven. */
  #wand .eerst .regel + .regel .tekst { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #wand .eerst .regel + .regel b { display: inline; font-size: 14px; }
  #wand .eerst .regel + .regel .zin { display: inline; margin: 0 0 0 6px; }
  #wand .eerst .regel + .regel .knopje { height: 30px; font-size: 12.5px; }
  .eerst .tekst { flex: 1; min-width: 0; }
  .eerst b { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .eerst .stip { background: var(--gloed); }
  .eerst .zin { display: block; font-size: 13px; color: var(--zacht); line-height: 1.4; margin-top: 2px; }
  .eerst .daarna { color: var(--gedempt); }

  /* Elke functie op één regel met zijn stand, in de groepen van de waaier. */
  .groepen { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-content: start; }
  .kolom { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .groep { padding: 8px 12px 6px; border-radius: 18px; }
  .groep h3 { margin: 0 0 2px 4px; font-size: 13px; font-weight: 700; color: var(--gedempt); }
  .func { display: flex; align-items: center; gap: 10px; width: 100%; padding: 4px; border: 0; border-top: 1px solid var(--glas-rand); background: none; color: inherit; font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; }
  .groep h3 + .func { border-top: 0; }
  .func .naam { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .func .naam > span { display: block; font-size: 11.5px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .func .naam > span.let { color: var(--gloed-zacht); }
  .func.gekozen { background: rgb(var(--wit) / 0.07); border-radius: 10px; }
  .func:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; border-radius: 10px; }
  .stand { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .stand .stip { width: 7px; height: 7px; background: currentColor; }
  .stand.werkt { color: var(--mint-t); }
  .stand.kijkt { color: var(--ijs-t); }
  .stand.leert { color: var(--violet-t); }
  .stand.uit { color: var(--gedempt); }
  .stand.mis { color: var(--gloed-t); }
  .stand.nodig { color: var(--zon-t); }
  /* Op de wand wat het nu doet achter de naam, op één regel (schets Wand-Stand-Een). */
  #wand .func .naam > span { display: inline; margin-left: 6px; }
  .erbij .func { cursor: default; }
  .erbij .func .naam > span { display: inline; margin-left: 6px; }

  /* De weg naar zelf regelen: de haltes op een lijn, en drie maten. */
  .weg { padding: 12px 20px; border-radius: 20px; display: grid; grid-template-columns: 230px minmax(0, 1fr) 320px; gap: 22px; align-items: center; }
  .weg[hidden] { display: none; }
  .weg h3 { margin: 0; font-family: var(--kop); font-size: 18px; font-weight: 600; }
  .weg p { margin: 3px 0 0; font-size: 12.5px; color: var(--gedempt); line-height: 1.4; }
  .lijn { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .lijn::before { content: ''; position: absolute; left: calc(50% / var(--n)); right: calc(50% / var(--n)); top: 9px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--mint) 0 var(--gedaan), rgb(var(--wit) / 0.14) var(--gedaan)); }
  .halte { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; min-width: 0; }
  .halte i { width: 20px; height: 20px; border-radius: 50%; background: rgb(var(--wit) / 0.2); border: 3px solid rgb(var(--nacht)); }
  .halte.klaar i { background: var(--mint); }
  .halte.nu i { background: #fff; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15); }
  .halte.doel i { background: var(--zon); }
  .halte b { font-size: 13px; }
  .halte span { font-size: 11.5px; color: var(--gedempt); line-height: 1.3; max-width: 150px; }
  .halte.doel b { color: var(--zon-t); }
  .maten { display: flex; flex-direction: column; gap: 6px; }
  .maat { display: grid; grid-template-columns: minmax(0, 1fr) 70px 58px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--zacht); }
  .maat .meter { height: 6px; border-radius: 6px; background: rgb(var(--wit) / 0.1); overflow: hidden; }
  .maat .meter i { display: block; height: 100%; background: var(--mint); border-radius: 6px; }
  .maat b { text-align: right; color: var(--tekst); white-space: nowrap; }

  /* Het blad: over de rechterkant heen, tot onderaan, zoals het weer op Thuis. */
  .blad { position: absolute; left: 516px; right: 0; top: 0; bottom: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; background: rgb(var(--nacht) / 0.96); z-index: 5; overflow: auto; }
  .blad[hidden] { display: none; }
  .blad .bovenaan { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
  .blad .bovenaan .stand { padding: 0 2px; }
  .blad .bovenaan .stand::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .blad .sluit { width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 18px; cursor: pointer; flex: none; }
  .blad .twee { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  .blad h4 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--gedempt); }
  .blad .lijst { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--zacht); }
  .blad .lijst li { display: flex; gap: 8px; }
  .blad .lijst li::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--mint); margin-top: 7px; }
  .blad .nu { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: rgb(var(--wit) / 0.05); font-size: 14px; color: var(--zacht); }
  .blad .nu .stand::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .blad .som { padding: 14px 16px; border-radius: 18px; background: rgba(247, 181, 72, 0.07); border: 1px solid rgba(247, 181, 72, 0.25); }
  .blad .som .getal { font-family: var(--kop); font-size: 34px; font-weight: 600; line-height: 1.05; color: var(--zon-t); }
  .blad .som .getal small { font-size: 16px; color: var(--zacht); font-weight: 500; }
  /* De batterij (besluit 230): de maat en wat hij oplevert naast elkaar, en wanneer hij bijsprong per uur. */
  .blad .som .somtop { display: flex; flex-wrap: wrap; gap: 10px 32px; }
  .blad .som .uren { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; height: 40px; }
  .blad .som .uren i { display: block; border-radius: 3px 3px 1px 1px; background: rgb(var(--wit) / 0.08); }
  .blad .som .uren i.aan { background: var(--zon); }
  .blad .som .assen { display: flex; justify-content: space-between; font-size: 11px; color: var(--gedempt); margin-top: 4px; }
  /* Hoe je huis warmte vasthoudt (besluit 231): een dag zonder verwarming, twee getallen, en per kamer wat het weet. */
  .blad .thermisch { display: flex; flex-direction: column; gap: 10px; }
  .blad .thermisch .bovenin { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 18px; }
  .blad .thermisch .grafiek { padding: 10px 14px 6px; border-radius: 18px; background: rgb(var(--wit) / 0.04); }
  .blad .thermisch svg { display: block; width: 100%; height: 96px; font-size: 11px; }
  .blad .thermisch svg line { stroke: rgb(var(--wit) / 0.07); }
  .blad .thermisch svg text { fill: var(--gedempt); }
  .blad .thermisch svg text.naam { font-size: 12px; font-weight: 700; }
  .blad .thermisch svg .lijn { fill: none; stroke-width: 2.5; stroke-linecap: round; }
  .blad .thermisch .vast { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .blad .thermisch .vast .getal { font-family: var(--kop); font-size: 32px; font-weight: 600; line-height: 1; }
  .blad .thermisch .vast .getal.klein { font-size: 22px; }
  .blad .thermisch .vast .getal small { font-family: var(--romp); font-size: 13.5px; font-weight: 500; color: var(--zacht); margin-left: 6px; }
  .blad .thermisch .vast p { margin: 3px 0 0; font-size: 13px; line-height: 1.4; color: var(--zacht); }
  .blad .thermisch .kamers { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 0 22px; }
  .blad .thermisch h5 { margin: 0 0 2px; font-family: var(--kop); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .blad .thermisch h5 i { width: 10px; height: 3px; border-radius: 2px; }
  .blad .thermisch .weet { display: grid; grid-template-columns: minmax(0, 1fr) auto 40px; gap: 0 10px; align-items: baseline; padding: 3px 0; border-top: 1px solid rgb(var(--wit) / 0.06); font-size: 13.5px; }
  .blad .thermisch .weet:first-of-type { border-top: 0; }
  .blad .thermisch .weet span { color: var(--zacht); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blad .thermisch .weet b { font-family: var(--kop); font-weight: 600; font-size: 14.5px; white-space: nowrap; }
  .blad .thermisch .weet b.nog { font-family: var(--romp); font-size: 12.5px; color: var(--gedempt); }
  .blad .thermisch .zeker { display: inline-flex; gap: 3px; align-self: center; }
  .blad .thermisch .zeker i { width: 7px; height: 4px; border-radius: 2px; background: rgb(var(--wit) / 0.12); }
  .blad .thermisch .zeker i.ja { background: var(--violet); }
  .blad .waar { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .kamerkaart { padding: 12px 14px; border-radius: 16px; background: rgba(110, 231, 183, 0.06); border: 1px solid rgba(110, 231, 183, 0.22); }
  .kamerkaart b { display: block; font-size: 15px; }
  .kamerkaart span { display: block; font-size: 12.5px; color: var(--zacht); margin-top: 2px; }
  .kanook { padding: 14px 16px; border-radius: 18px; border: 1px solid rgba(247, 181, 72, 0.3); background: rgba(247, 181, 72, 0.06); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: center; color: inherit; text-decoration: none; }
  .kanook .wanneer { color: var(--zon-t); font-size: 13px; font-weight: 700; }
  .kanook b { font-size: 16px; }
  .kanook p { margin: 0; font-size: 14px; color: var(--zacht); }
  .kanook .knop { grid-row: 1 / 4; grid-column: 2; background: var(--accent); color: var(--op-accent); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; }
  .blad .onder { margin-top: auto; display: flex; gap: 10px; align-items: center; }
  .blad .onder a { height: 42px; padding: 0 18px; border-radius: 14px; background: var(--accent); color: var(--op-accent); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; text-decoration: none; }
  .achter { position: fixed; inset: 0; background: rgba(4, 8, 16, 0.55); z-index: 29; }
  /* Klaarzetten in Home Assistant (besluit 179). */
  .klaargroep { display: flex; flex-direction: column; gap: 6px; }
  .klaargroep h4 { margin: 4px 0 0; }
  .klaarregel { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 14px; background: rgb(var(--wit) / 0.04); }
  .klaarregel.mist { background: rgba(255, 122, 77, 0.07); }
  .klaarregel b { display: block; font-size: 14.5px; }
  .klaarregel span:not(.stip), .klaarregel small { display: block; font-size: 13px; color: var(--zacht); margin-top: 1px; }
  .klaarregel small { color: var(--gedempt); }

  /* De telefoon: onder elkaar wat eerst moet, de waaier, de weg, wat erbij kan en de functies. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 12px; }
  #tel .tellers { justify-content: flex-start; font-size: 13px; padding: 0; }
  #tel .eerst .regel { flex-direction: column; align-items: stretch; gap: 8px; }
  #tel .eerst .knopje { align-self: flex-start; }
  #tel .waaierveld svg { display: block; width: 100%; height: auto; }
  #tel .groepen-tel { display: flex; flex-direction: column; gap: 10px; }
  #tel .groep { padding: 4px 12px; }
  #tel .groep h3 { margin: 8px 0 2px; }
  #tel .func { min-height: 46px; font-size: 14.5px; }
  #tel .func .naam > span { font-size: 12px; }
  #tel .erbij .func .naam { white-space: normal; }
  #tel .erbij .func .naam > span { display: block; margin: 0; }
  #tel .weg { display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding: 14px; }
  #tel .lijn { display: block; }
  #tel .lijn::before { display: none; }
  #tel .halte { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 10px; align-items: start; text-align: left; padding-bottom: 10px; }
  #tel .halte::before { content: ''; position: absolute; left: 9px; top: 20px; bottom: -2px; width: 3px; background: rgb(var(--wit) / 0.14); }
  #tel .halte.klaar::before { background: var(--mint); }
  #tel .halte:last-child::before { display: none; }
  #tel .halte i { grid-row: 1 / 3; }
  #tel .halte b { font-size: 14px; }
  #tel .halte span { font-size: 12.5px; max-width: none; }
  #tel .maat { grid-template-columns: minmax(0, 1fr) 80px 60px; font-size: 13px; }
  #tel .blad { position: fixed; left: 8px; right: 8px; top: auto; bottom: 8px; max-height: 84vh; border-radius: 26px; z-index: 30; }
  #tel .blad .twee { grid-template-columns: 1fr; }
  #tel .blad .thermisch .bovenin { grid-template-columns: 1fr; gap: 10px; }
  #tel .blad .thermisch .kamers { grid-template-columns: 1fr; gap: 10px; }
</style>
