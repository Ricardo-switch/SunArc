<!doctype html>

<head>
<meta charset="utf-8">

<link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="laden.css">

<style>
  /* Apparaat toevoegen (besluit 293), versie 3: Toevoegen maakt klaar (schets Wand-Toevoegen-Klaar, 18 november 2026). */
  #wand main { display: flex; flex-direction: column; gap: 12px; height: 100%; }
  .terug { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--zacht); text-decoration: none; margin-bottom: 4px; }
  .veld { flex: 1; min-height: 0; display: grid; grid-template-columns: 252px 300px minmax(0, 1fr); gap: 14px; }
  .kolom { padding: 14px 10px; border-radius: 24px; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; }
  h4.tussen { margin: 10px 10px 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gedempt); }
  h4.tussen.nieuw { color: var(--gloed-t); }
  /* Links: de soorten. */
  .srt { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 44px; padding: 5px 10px; border-radius: 13px; color: var(--tekst); text-decoration: none; }
  .srt:hover { background: rgb(var(--wit) / 0.05); }
  .srt.aan { background: rgb(var(--wit) / 0.1); box-shadow: inset 0 0 0 1px rgb(var(--wit) / 0.28); }
  .srt .ik { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgb(var(--wit) / 0.06); color: var(--zacht); }
  .srt .ik svg { width: 19px; height: 19px; }
  .srt .plus { font-size: 20px; font-weight: 700; }
  .srt b { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srt small { font-size: 12px; font-weight: 700; color: var(--gedempt); white-space: nowrap; }
  small.nieuw { color: var(--gloed-t); }
  /* Midden: wat SunArc van die soort vond. */
  .midden { padding: 16px 12px 12px; }
  .midden h3 { margin: 0 8px; font-family: var(--kop); font-size: 20px; font-weight: 600; }
  .midden .lead, #tel .lead { margin: 2px 8px 2px; font-size: 12.5px; color: var(--gedempt); max-width: none; }
  .groep { display: flex; flex-direction: column; }
  .vond { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 11px; align-items: center; min-height: 52px; padding: 6px 8px; border-radius: 13px; color: var(--tekst); text-decoration: none; }
  .vond:hover { background: rgb(var(--wit) / 0.05); }
  .vond.aan { background: rgb(var(--wit) / 0.1); box-shadow: inset 0 0 0 1px rgb(var(--wit) / 0.3); }
  .vond .ik { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); color: var(--zacht); }
  .vond .ik svg { width: 21px; height: 21px; }
  .vond .tekst { min-width: 0; }
  .vond b { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vond small { display: block; font-size: 12px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vond .r { font-size: 16px; color: var(--gedempt); }
  .vond .r.af { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: rgba(110, 231, 183, 0.18); color: var(--mint); }
  .meer, .leeg { margin: 4px 8px; font-size: 12.5px; color: var(--gedempt); }
  .tvoet { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid rgb(var(--wit) / 0.07); display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: var(--gedempt); line-height: 1.4; }
  .verborgenregel { display: flex; justify-content: space-between; font-weight: 700; color: var(--zacht); text-decoration: none; }
  .verborgenregel em { font-style: normal; color: var(--gedempt); }
  .terughalen { height: 34px; padding: 0 13px; border-radius: 999px; border: 0; background: rgb(var(--wit) / 0.1); color: var(--tekst); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  /* Rechts: het blad om hem klaar te zetten. */
  .paneel { padding: 18px 22px; border-radius: 24px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
  :is(.paneel, .blad) .wie { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 2px 14px; align-items: center; }
  :is(.paneel, .blad) .wie .ik { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); }
  :is(.paneel, .blad) .wie .ik svg { width: 26px; height: 26px; }
  :is(.paneel, .blad) .wie h2 { margin: 0; font-family: var(--kop); font-size: 24px; font-weight: 600; }
  :is(.paneel, .blad) .wie small { font-size: 13px; color: var(--gedempt); }
  .regels { display: flex; flex-direction: column; gap: 4px; }
  .regels a.w { text-decoration: none; }
  .w.zon { color: var(--zon-t); font-weight: 700; white-space: nowrap; }
  .hoe { margin: 4px 0 0; padding: 11px 13px; border-radius: 14px; background: rgb(var(--wit) / 0.04); font-size: 13px; line-height: 1.5; color: var(--zacht); }
  .staatklaar { margin: 0; font-size: 13.5px; font-weight: 700; color: var(--mint); }
  .kies { flex: 1; display: grid; place-items: center; text-align: center; padding: 0 30px; color: var(--zacht); font-size: 14px; }
  .onderbalk { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .verberg { border: 0; background: transparent; color: var(--zacht); font: inherit; font-size: 13.5px; font-weight: 700; padding: 0; display: inline-flex; align-items: center; gap: 8px; text-align: left; cursor: pointer; }
  .verberg svg { width: 18px; height: 18px; flex: none; }
  .verberg small { display: block; font-weight: 500; font-size: 12px; color: var(--gedempt); }
  .zet { height: 46px; padding: 0 22px; border-radius: 15px; border: 0; background: var(--tekst); color: var(--tegen); font: inherit; font-weight: 700; font-size: 15px; white-space: nowrap; display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; }
  .zet.stil { background: rgb(var(--wit) / 0.1); color: var(--tekst); }
  /* Een schakelaar instellen (besluit 297): wat hij aanzet, de naam, waar, en wat SunArc mag. */
  .stap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: center; padding-top: 8px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .stap > b { font-size: 15px; font-weight: 600; align-self: start; padding-top: 10px; }
  .stap > b small { display: block; font-size: 12.5px; font-weight: 500; color: var(--gedempt); margin-top: 2px; }
  .watkeuzes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  #tel .watkeuzes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .watkeuze { height: auto; min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 7px; border-radius: 14px; background: rgb(var(--wit) / 0.045); border: 1px solid rgb(var(--wit) / 0.07); font: inherit; font-size: 13px; font-weight: 600; color: var(--zacht); cursor: pointer; }
  :is(.paneel, .blad) .watkeuze svg { width: 22px; height: 22px; flex: none; }
  .watkeuze span { font-size: 12px; }
  :is(.paneel, .blad) .watkeuze[aria-pressed='true'] { background: rgba(247, 181, 72, 0.12); border-color: var(--zon); color: var(--tekst); }
  .onder { margin: 6px 0 0; font-size: 13px; color: var(--zacht); }
  .invoer { height: 42px; width: 100%; box-sizing: border-box; padding: 0 14px; border-radius: 13px; background: rgb(var(--wit) / 0.06); border: 1px solid var(--glas-rand); color: var(--tekst); font: inherit; font-size: 15.5px; font-weight: 600; }
  .stap .knoppen { display: flex; flex-direction: column; gap: 8px; }
  .knoplabel { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; color: var(--zacht); }
  .knoplabel input { height: 36px; padding: 0 12px; border-radius: 11px; background: rgb(var(--wit) / 0.06); border: 1px solid var(--glas-rand); color: var(--tekst); font: inherit; font-weight: 600; }
  .seg { display: inline-grid; grid-auto-flow: column; gap: 3px; padding: 3px; border-radius: 13px; background: rgb(var(--wit) / 0.06); }
  .seg button { height: 38px; padding: 0 18px; border: 0; border-radius: 10px; background: none; color: var(--zacht); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .seg button[aria-pressed='true'] { background: var(--tekst); color: var(--tegen); }
  .let { margin: 0; padding: 11px 14px; border-radius: 14px; background: rgba(111, 211, 255, 0.07); border: 1px solid rgba(111, 211, 255, 0.18); font-size: 13.5px; color: var(--zacht); line-height: 1.4; }
  .fout { margin: 0; font-size: 13.5px; color: var(--gloed-t); }
  .fout:empty { display: none; }
  .klaar { display: flex; align-items: center; gap: 12px; padding-top: 10px; border-top: 1px solid rgb(var(--wit) / 0.07); margin-top: auto; }
  .klaar .hoofd { height: 46px; padding: 0 26px; border: 0; border-radius: 14px; background: var(--tekst); color: var(--tegen); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .klaar .hoofd:disabled { opacity: 0.35; cursor: default; }
  .klaar .stil { margin-left: auto; border: 0; background: none; color: var(--gedempt); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .lijst { display: flex; flex-direction: column; }
  .lijst .rij { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 1px 12px; align-items: center; min-height: 56px; padding: 6px 4px; }
  .lijst .rij .ik { grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); }
  .lijst .rij .ik svg { width: 22px; height: 22px; }
  .lijst .rij b { font-size: 15px; font-weight: 600; align-self: end; }
  .lijst .rij small { grid-column: 2; font-size: 12.5px; color: var(--gedempt); align-self: start; }
  .lijst .rij .stil { grid-row: 1 / 3; grid-column: 3; border: 0; background: none; color: var(--gedempt); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .lijst .rij small a { color: inherit; }
  /* Een laadpaal uit losse sensoren (besluit 301): per soort een groep vinkjes. */
  .lgroep { min-width: 0; }
  .lgroep h3 { margin: 4px 0 6px; font-size: 13px; font-weight: 700; color: var(--gedempt); }
  .lsensor { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 44px; border-top: 1px solid rgb(var(--wit) / 0.06); cursor: pointer; }
  .lsensor input { width: 18px; height: 18px; accent-color: var(--zon); }
  .lsensor > span { min-width: 0; }
  .lsensor b { display: block; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .lsensor small { display: block; font-size: 11.5px; color: var(--gedempt); font-family: ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lsensor em { font-style: normal; font-size: 13px; font-weight: 700; white-space: nowrap; max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
  /* De telefoon: de soorten, de lijst, en het blad van onderen. */
  #tel .inhoud { padding: 18px 16px 130px; display: flex; flex-direction: column; gap: 10px; }
  #tel [data-stap] { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #tel .groep { padding: 4px; border-radius: 20px; }
  #tel .srt, #tel .vond { min-height: 52px; }
  #tel .srt b, #tel .vond b { font-size: 15.5px; }
  #tel .srt .ik, #tel .vond .ik { width: 38px; height: 38px; }
  #tel .srt .ik svg, #tel .vond .ik svg, #tel .blad .wie .ik svg { width: 21px; height: 21px; }
  #tel .srt { grid-template-columns: 38px minmax(0, 1fr) auto; }
  #tel [data-stap] > h3 { display: none; }
  #tel .tvoet { border: 0; padding: 4px 4px 0; }
  #tel .paneel { padding: 16px; border-radius: 22px; overflow: visible; }
  #tel .stap { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  #tel .stap > b { padding-top: 0; }
  #tel .klaar { margin-top: 4px; }
  #tel [data-laag][hidden] { display: none; }
  #tel .achter { position: fixed; inset: 0; background: rgba(4, 8, 16, 0.6); z-index: 60; }
  #tel .blad { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; overscroll-behavior: contain; padding: 18px 18px calc(22px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; display: flex; flex-direction: column; gap: 10px; background: #0e1726; border-top: 1px solid rgb(var(--wit) / 0.1); z-index: 61; }
  .sc-licht #tel .blad { background: #f3f6fa; }
  #tel .blad .greep { width: 40px; height: 5px; border-radius: 3px; background: rgb(var(--wit) / 0.2); align-self: center; margin-top: -6px; flex: none; }
  #tel .blad .onderbalk { flex-direction: column-reverse; align-items: stretch; }
  #tel .blad .zet { justify-content: center; height: 50px; }
  #tel .blad .verberg { justify-content: center; }
  #tel .blad .verberg small { display: none; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" data-t-aria-label="nav.hoofdmenu"></nav>

      <div>
        <a class="terug" href="apparaten.html">‹ <span data-t="nav.apparaten"></span></a>

      </div>

      <div data-stap></div>
    </div>
    <div data-laag hidden></div>
    <nav class="tabs" id="tabs" data-t-aria-label="nav.hoofdmenu"></nav>
  </div>

  <script src="kit/nav.js"></script>
  <script src="basis-meldingen.js"></script>
  <script src="basis.js"></script>
