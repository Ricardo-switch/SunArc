<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>SunArc</title>
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png?v=sunarc">
<script>
  /*
   * Regeling is weg (besluit 317 en 318): Klimaat en Helpen bij de cv staan bij
   * Klimaat, op zon in het blad van elk apparaat bij Apparaten. Een oude link,
   * een melding of een bladwijzer komt zo op de goede plek.
   */
  (function () {
    var deel = location.hash.slice(1);
    location.replace(deel === 'helpen' ? 'comfort.html#helpen' : deel === 'klimaat' ? 'comfort.html' : 'apparaten.html');
  })();
</script>
</head>
<body style="background: #0b1424"></body>
</html>
