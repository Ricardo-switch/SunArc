<style>
  /* Comfort (besluit 130, schets Wand-Instellingen-Comfort): per kamer een band per dagdeel. */
  .bovenrij { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .nu-temp { font-family: var(--kop); font-size: 15px; color: var(--zacht); }
  .nu-temp b { font-size: 22px; color: var(--tekst); }
  .nukort { flex: 1; min-width: 0; align-self: center; padding: 5px 12px; border-radius: 999px; background: rgb(var(--wit) / 0.06); font-size: 13px; color: var(--zacht); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; justify-self: start; }
  .bovenrij .nukort { flex: 0 1 auto; margin-right: auto; }
  /* Terug naar standaard (besluit 204): klein, rechts in de kopregel. */
  .stdknop { align-self: center; height: 30px; padding: 0 12px; font-size: 13px; margin-left: auto; }
  .nukort ~ .stdknop { margin-left: 0; }
  #tel .bovenrij { flex-wrap: wrap; }
  #tel .bovenrij .nukort { order: 3; flex-basis: 100%; white-space: normal; border-radius: 12px; }
  .band { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 18px; align-items: center; padding: 10px 0; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .band:first-of-type { border-top: 0; }
  .band .naam b { display: block; font-size: 15px; font-weight: 600; }
  .band .naam span { font-size: 12.5px; color: var(--gedempt); }
  .schaal { position: relative; height: 42px; touch-action: none; }
  .schaal .baan { position: absolute; left: 0; right: 0; top: 15px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255, 122, 77, 0.35), rgb(var(--wit) / 0.08) 40%, rgb(var(--wit) / 0.08) 60%, rgba(111, 211, 255, 0.35)); }
  .schaal .goed { position: absolute; top: 13px; height: 12px; border-radius: 6px; background: rgba(110, 231, 183, 0.55); }
  .schaal .greep { position: absolute; top: 7px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; border: 0; padding: 0; background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); display: grid; place-items: center; cursor: ew-resize; touch-action: none; }
  .schaal .greep i { width: 9px; height: 9px; border-radius: 50%; }
  /* Een ruimer vak om het bolletje te pakken met een vinger, en zichtbaar vast tijdens het slepen (21 oktober 2026). */
  .schaal .greep::before { content: ''; position: absolute; inset: -12px; border-radius: 50%; }
  .schaal .greep.pakt { transform: scale(1.18); box-shadow: 0 0 0 6px rgb(var(--wit) / 0.18), 0 2px 10px rgba(0, 0, 0, 0.5); cursor: grabbing; }
  .schaal .greep:focus-visible { outline: 3px solid var(--tekst); outline-offset: 2px; }
  .schaal .maat { position: absolute; top: 32px; font-size: 10.5px; color: var(--gedempt); transform: translateX(-50%); pointer-events: none; }
  /* Per dagdeel twee regels, met de uitleg na een tik (besluit 133, schets Wand-Comfort-Regels). */
  .regels { grid-column: 2; display: grid; grid-template-columns: 1fr; gap: 6px; }
  .regel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 6px 8px 6px 12px; border-radius: 14px; background: rgb(var(--wit) / 0.04); }
  .regel .wat { display: flex; align-items: center; gap: 6px; min-height: 30px; border: 0; padding: 0; background: none; color: var(--tekst); font: inherit; font-size: 13.5px; font-weight: 600; white-space: nowrap; text-align: left; cursor: pointer; }
  .regel .wat i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .regel .wat b { font-family: var(--kop); font-size: 15px; }
  .regel .wat em { font-style: normal; font-weight: 500; color: var(--zacht); }
  .regel .wat:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; border-radius: 8px; }
  .regel.uit .wat { color: var(--gedempt); }
  .regel small { grid-column: 1 / 3; padding: 0 0 4px; font-size: 12px; color: var(--gedempt); line-height: 1.45; }
  .regel small .z { color: var(--zon-t); }
  .schaal .zonband { position: absolute; top: 13px; height: 12px; border-radius: 6px; background: repeating-linear-gradient(135deg, rgba(247, 181, 72, 0.55) 0 4px, rgba(247, 181, 72, 0.15) 4px 8px); pointer-events: none; }
  .schaal .zonstip { position: absolute; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--zon); box-shadow: 0 0 8px rgba(247, 181, 72, 0.7); pointer-events: none; }
  .zonnet { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 12px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .zonnet .blok { padding: 12px 14px; border-radius: 16px; background: rgb(var(--wit) / 0.04); display: flex; flex-direction: column; gap: 8px; }
  .zonnet .label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .zonnet .uitleg { margin: 0; font-size: 12.5px; color: var(--gedempt); line-height: 1.45; }
  .zonnet .stapper b { font-size: 17px; min-width: 96px; }
  /* Voorrang in twee lijsten (besluit 134, schets Wand-Instellingen-Comfort#voorrang). */
  .lijsten { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .rang { padding: 14px 16px; border-radius: 18px; background: rgb(var(--wit) / 0.04); border: 1px solid rgb(var(--wit) / 0.07); display: flex; flex-direction: column; gap: 8px; }
  .rang h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--kop); font-size: 17px; font-weight: 600; }
  .rang .r { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: rgb(var(--wit) / 0.06); }
  .rang .r i { font-style: normal; font-family: var(--kop); font-size: 17px; font-weight: 600; color: var(--zacht); text-align: center; }
  .rang .r b { font-size: 15px; }
  .rang .r b small { display: block; font-size: 12px; font-weight: 500; color: var(--gedempt); }
  .lijsten.drie { grid-template-columns: 1fr 1fr 1fr; }
  .rang .schuif { display: flex; gap: 4px; }
  .rang .schuif button { width: 32px; height: 32px; border-radius: 10px; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font: inherit; font-size: 15px; cursor: pointer; }
  .rang .schuif button:disabled { opacity: 0.3; cursor: default; }
  .rang .niet { margin: 0; font-size: 12.5px; color: var(--gedempt); }
  .voorstelrij { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: rgb(var(--wit) / 0.04); }
  #tel .lijsten { grid-template-columns: 1fr; }
  .kamerkeuze { display: flex; gap: 6px; flex-wrap: wrap; }
  .kamerkeuze button { height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: rgb(var(--wit) / 0.07); color: var(--zacht); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .kamerkeuze button[aria-pressed='true'] { background: var(--accent); color: var(--op-accent); }
  .schakel { position: relative; flex: none; width: 36px; height: 20px; border-radius: 999px; border: 0; padding: 0; background: rgb(var(--wit) / 0.14); cursor: pointer; transition: background 0.15s; }
  .schakel::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #c9d3dc; transition: left 0.15s; }
  .schakel[aria-checked='true'].heat { background: var(--gloed); }
  .schakel[aria-checked='true'].cool { background: var(--ijs); }
  .schakel[aria-checked='true']::after { left: 18px; background: #fff; }
  .schakel:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .rij2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-top: 12px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .rij2 .label { font-size: 14.5px; font-weight: 600; display: block; margin-bottom: 6px; }
  .rij2 .uitleg { font-size: 12.5px; color: var(--gedempt); margin: 6px 0 0; }
  .stapper { display: flex; align-items: center; gap: 10px; }
  .stapper button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 18px; cursor: pointer; }
  .stapper b { font-family: var(--kop); font-size: 22px; min-width: 64px; text-align: center; }
  .stapper .geen { width: auto; border-radius: 12px; padding: 0 12px; font-size: 13px; font-weight: 700; }
  .uren { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .dag { height: 34px; border-radius: 10px; overflow: hidden; display: flex; margin-top: 4px; }
  .dag i { height: 100%; }
  .dagmaat { position: relative; height: 16px; font-size: 10.5px; color: var(--gedempt); margin-top: 4px; }
  .dagmaat span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .dagmaat span:first-child { transform: none; }
  .dagmaat span:last-child { transform: translateX(-100%); }
  .daglegenda { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--zacht); }
  .daglegenda span { display: inline-flex; align-items: center; gap: 6px; }
  .daglegenda i { width: 10px; height: 10px; border-radius: 3px; }
  .schaal .niets { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: var(--gedempt); background: var(--diep, #101b2d); padding: 0 8px; border-radius: 6px; }
  #tel .band { grid-template-columns: 1fr; gap: 8px; }
  #tel .regels, #tel .zonnet { grid-column: 1; grid-template-columns: 1fr; }
  #tel .regel { padding: 8px 10px 8px 12px; }
  #tel .regel .wat { font-size: 15px; }
  #tel .schakel { width: 40px; height: 24px; }
  #tel .schakel::after { width: 18px; height: 18px; top: 3px; left: 3px; }
  #tel .schakel[aria-checked='true']::after { left: 19px; }
  #tel .rij2, #tel .uren { grid-template-columns: 1fr; }
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  /* Wiens comfort (besluit 147). */
  .wiekies { height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid rgb(var(--wit) / 0.16); background: rgb(var(--wit) / 0.06); color: var(--tekst); font: inherit; font-size: 14.5px; font-weight: 600; color-scheme: dark; }
  .wiekies option { background: #14203a; }
  /* Klimaat per kamer (besluit 317, schets Wand-Klimaat-Kamer): links hoe warm, rechts wat ervoor zorgt. */
  /* Wat ervoor zorgt iets breder: met het vraagteken liepen de namen over drie regels en schoof het blad (19 november 2026). */
  .kolommen { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  /* Een kamer met zones (schets Wand-Klimaat-Subzone): Wat ervoor zorgt krijgt de ruimte, zodat elk apparaat op één regel past. */
  .kolommen.metzones { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
  /* Alleen verwarmen of alleen koelen: de regel over de hele breedte, anders twee naast elkaar. */
  .kolommen.metzones .kolom .regels { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .kolom { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kolom.zorgt { gap: 12px; padding-left: 22px; border-left: 1px solid rgb(var(--wit) / 0.07); }
  /* Met zones staan er meer vakken onder elkaar: iets minder ruimte ertussen, zodat het blad past (19 november 2026). */
  #wand .kolommen.metzones .zorgt { gap: 7px; }
  .kolomkop { margin: 0 0 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gedempt); }
  .kolom .band { grid-template-columns: 1fr; gap: 6px; }
  .kolom .regels { grid-column: 1; }
  .kolom .zonnet { grid-template-columns: 1fr; gap: 8px; padding-top: 8px; }
  /* Compact in de kolom (de wand scrolt nooit): de naam van het dagdeel op een regel, verwarmen en koelen naast elkaar. */
  .kolom .band { padding: 6px 0; gap: 4px; }
  .kolom .band .naam { display: flex; align-items: baseline; gap: 8px; }
  .kolom .band .naam b { display: inline; }
  .kolom .regels { grid-template-columns: 1fr 1fr; }
  .kolom .regel { padding: 4px 6px 4px 10px; }
  .kolom .regel .wat { font-size: 12.5px; gap: 4px; }
  .kolom .regel .wat b { font-size: 14px; }
  .kolom .kolom.zorgt, .kolom.zorgt { padding-left: 18px; }
  .kolom .regel small { grid-column: 1 / -1; }
  .kolom .zonnet .blok { padding: 8px 12px; gap: 6px; }
  #tel .kolom .regels { grid-template-columns: 1fr; }
  #tel .kolommen { grid-template-columns: 1fr; gap: 18px; }
  #tel .kolom.zorgt { padding-left: 0; border-left: 0; padding-top: 14px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  /* Helpt ook de cv, onder een airco (besluit 292 en 317). */
  .cvregel { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 8px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .cvregel .l { display: flex; flex-direction: column; min-width: 0; }
  .cvregel .l b { font-size: 13.5px; }
  .cvregel .l span { font-size: 12.5px; color: var(--gedempt); }
  /* Helpen bij de cv (besluit 292, schets Wand-Helpen-Cv), van Regeling: wat warmte kost, en per airco een kaart. */
  .bijgetallen { flex-wrap: wrap; gap: 8px 22px; justify-content: flex-start; }
  .bijstap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--gedempt); }
  .bijstap button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 16px; cursor: pointer; }
  .bijstap b { min-width: 64px; text-align: center; color: var(--tekst); font-size: 14.5px; }
  .regelrij .l b { font-size: 15px; }
  .vorm p a { color: var(--ijs-t); text-decoration: none; font-weight: 600; }
  .kost { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 18px; background: rgb(var(--wit) / 0.045); }
  .kostbalk { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr) auto; align-items: center; gap: 12px; font-size: 13.5px; color: var(--zacht); }
  .kostbalk i { height: 10px; border-radius: 5px; background: rgb(var(--wit) / 0.06); overflow: hidden; }
  .kostbalk i b { display: block; height: 100%; border-radius: 5px; }
  .kostbalk em { font-style: normal; font-weight: 700; color: var(--tekst); white-space: nowrap; }
  .oordeel { margin: 2px 0 0; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--gedempt); }
  .oordeel b { color: var(--tekst); }
  .oordeel b.goed { color: var(--mint-t); }
  .helpers { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .helper { padding: 4px 14px 12px; border-radius: 18px; background: rgb(var(--wit) / 0.045); border: 1px solid rgb(var(--wit) / 0.07); }
  .helper.uit { opacity: 0.7; }
  .helpstand { margin: 2px 0 0; display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
  .helpstand i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .helpdag { margin: 8px 0 0; padding-top: 8px; border-top: 1px solid rgb(var(--wit) / 0.07); display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--gedempt); }
  .helpdag b { color: var(--tekst); font-weight: 600; }
  .tel-stand .kostbalk { grid-template-columns: 1fr auto; }
  /* Stopt, pomp sparen en stil naast elkaar: zo past Helpen bij de cv op de wand (besluit 317). */
  .helpdrie { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 18px; }
  .helpdrie .regelrij { align-items: flex-start; }
  #tel .helpdrie { grid-template-columns: 1fr; }
  .tel-stand .kostbalk i { grid-column: 1 / -1; grid-row: 2; }
</style>
