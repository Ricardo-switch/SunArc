<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>SunArc</title>
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png?v=sunarc">
<script>
  /*
   * Kamers en indeling is weg (besluit 317, stap 3 van de kwaliteitsronde): de
   * kamers, etages, buiten en verborgen staan bij Je huis, wat er verwarmt en
   * koelt bij Klimaat. Een oude link, een melding of een bladwijzer komt zo op
   * de goede plek: `#zolder/warmte` naar Klimaat, `#buiten` en `#verborgen`
   * naar dat blad in Je huis, `#los` naar de apparaten in Je huis, een etage
   * naar die etage, en een kamer naar zijn blad bij Klimaat.
   */
  (function () {
    var adres = decodeURIComponent(location.hash.slice(1));
    var delen = adres.split('/');
    var id = delen[0];
    var etages = ['kelder', 'bg', 'e1', 'e2', 'e3'];
    var naar = 'jehuis.html';
    if (delen[1] === 'warmte') naar = 'comfort.html#' + encodeURIComponent(id);
    else if (id === 'buiten' || id === 'verborgen') naar = 'jehuis.html#' + id;
    else if (id === 'los') naar = 'jehuis.html#bg/apparaten';
    else if (id && id !== 'nieuw' && etages.indexOf(id) < 0) naar = 'comfort.html#' + encodeURIComponent(id);
    else if (id && id !== 'nieuw') naar = 'jehuis.html#' + id;
    location.replace(naar);
  })();
</script>
</head>
<body style="background: #0b1424"></body>
</html>
