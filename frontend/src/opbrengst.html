<style>
  /* De wand (schets Wand-Opbrengst): de cijfers, de sankey, per apparaat. */
  /* Drie gelijke kolommen (schets Wand-Opbrengst-Stromen, 5 november 2026): het stroombeeld is één kaart. */
  #wand main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto minmax(0, 1fr); gap: 16px; height: 100%; min-width: 0; }
  .kop { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .wissel { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgb(var(--wit) / 0.06); }
  .wissel button { height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--zacht); font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
  .wissel button[aria-pressed='true'] { background: var(--accent); color: var(--op-accent); }
  .wissel button:focus-visible, .periode button:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .periode { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .periode button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--glas-rand); background: transparent; color: var(--tekst); font-size: 18px; cursor: pointer; }
  .periode button:disabled { opacity: 0.3; cursor: default; }
  .links { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .cijfers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .cijfers .cijfer { padding: 12px 12px 10px; border-radius: 16px; background: rgb(var(--wit) / 0.05); min-width: 0; }
  .cijfers .cijfer .mini { font-size: 11.5px; }
  .cijfers .cijfer .getal { font-size: 26px; white-space: nowrap; }
  .cijfers .cijfer .getal small { font-size: 12px; margin-left: 3px; }
  .cijfers .cijfer .klein { font-size: 11.5px; margin-top: 2px; }
  .cijfer .getal { font-size: 40px; line-height: 1.05; }
  .cijfer .getal small { font-family: var(--romp); font-size: 15px; color: var(--zacht); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
  .kaart { padding: 18px 20px; min-height: 0; }
  .midden { display: flex; flex-direction: column; }
  .midden [data-sankey] { flex: 1; min-height: 0; display: flex; }
  .midden [data-sankey] svg { width: 100%; height: 100%; }
  .telstromen svg { width: 100%; height: auto; display: block; margin-top: 8px; }
  .gasregel { margin-top: 8px; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: rgba(255, 138, 107, 0.06); font-size: 13px; color: var(--zacht); }
  .gasregel svg { width: 22px; height: 22px; }
  .gasregel > b { color: var(--tekst); font: 600 14px var(--kop); text-align: right; white-space: nowrap; }
  .gasregel small { display: block; font-size: 11.5px; color: var(--gedempt); font-weight: 500; }
  .gasregel span b { font-weight: 700; color: var(--tekst); }
  .rechts { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .rij { padding: 9px 0; border-top: 1px solid rgb(var(--wit) / 0.06); }
  .rij:first-of-type { border-top: 0; }
  .rij .boven { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .rij .boven b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .verdeel { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: rgb(var(--wit) / 0.07); margin-top: 7px; }
  .verdeel i { display: block; height: 100%; }
  .legenda { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 0; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .grafiekkop { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .blik, .maten { display: inline-flex; gap: 3px; padding: 3px; border-radius: 10px; background: rgb(var(--wit) / 0.06); }
  .maten { margin-top: 10px; }
  .blik button, .maten button { height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--zacht); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .blik button[aria-pressed='true'], .maten button[aria-pressed='true'] { background: var(--accent); color: var(--op-accent); }
  .staven { display: flex; align-items: end; gap: 2px; height: 120px; margin-top: 12px; }
  .staaf { flex: 1; height: 100%; min-width: 0; position: relative; display: flex; flex-direction: column; justify-content: flex-end; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 3px; }
  .staaf:hover, .staaf[aria-pressed='true'] { background: rgb(var(--wit) / 0.07); }
  .staaf:focus-visible { outline: 2px solid var(--tekst); outline-offset: 1px; }
  .staaf i { display: block; width: 100%; }
  .staaf i.zon { background: var(--zon); border-radius: 2px 2px 0 0; order: 1; }
  .staaf i.net { background: #9AAABB; opacity: 0.7; order: 2; }
  .staaf i.eerder { position: absolute; left: 15%; right: 15%; bottom: 0; background: rgb(var(--wit) / 0.18); border-radius: 2px 2px 0 0; }
  .staaf i:not(.eerder) { position: relative; border-radius: 2px 2px 0 0; }
  .detail { margin: 8px 0 0; min-height: 1.4em; color: var(--tekst); }
  .asje { display: flex; justify-content: space-between; font-size: 11px; color: var(--gedempt); margin-top: 4px; }

  /* De telefoon (schets Opbrengst). */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .wissel { display: grid; grid-template-columns: repeat(5, 1fr); }
  #tel .wissel button { padding: 0 4px; }
  #tel .periode { justify-content: space-between; margin: 0; }
  .drie { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .drie div { padding: 12px; }
  .drie .getal { font-size: 24px; display: block; }
  #tel .kaart { padding: 16px; }
  .sluipingang { display: block; color: inherit; text-decoration: none; }
  .sluipingang:hover { border-color: rgb(var(--wit) / 0.3); }
  .sluipingang:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
</style>
  <style>
    /* Per dak (besluit 254, stap 5). */
    .dakrijen { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
    .dakrij { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; }
    .daknaam { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .dakletter { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 800 12px var(--kop); color: #0b1424; }
    .dakstaaf { position: relative; height: 8px; border-radius: 6px; background: rgb(var(--wit) / 0.06); overflow: hidden; }
    .dakstaaf i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
    .dakrij b { text-align: right; font: 600 15px var(--kop); white-space: nowrap; }
    .dakrij b small { display: block; font: 600 11.5px var(--romp); color: var(--gedempt); }
    /* Nu (5 november 2026): het streepje van de heldere lucht, en live met een stip die klopt. */
    .dakstaaf em { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: rgb(var(--wit) / 0.7); border-radius: 1px; }
    .livelabel { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--zacht); }
    .livelabel i { width: 9px; height: 9px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 0 rgb(110 231 183 / 0.6); animation: klop 2s ease-out infinite; }
    @keyframes klop { 0% { box-shadow: 0 0 0 0 rgb(110 231 183 / 0.55); } 70% { box-shadow: 0 0 0 9px rgb(110 231 183 / 0); } 100% { box-shadow: 0 0 0 0 rgb(110 231 183 / 0); } }
    @media (prefers-reduced-motion: reduce) { .livelabel i { animation: none; } }
    .dakopval { margin: 10px 0 0; padding: 10px 12px; border-radius: 14px; background: rgba(255, 138, 107, 0.08); border: 1px solid rgba(255, 138, 107, 0.25); font-size: 13px; color: var(--zacht); line-height: 1.45; }
    /* De thuisaccu in deze periode (besluit 272): een stip in de kleur van de accu. */
    .accuregel { display: flex; gap: 8px; align-items: baseline; }
    .accuregel i { width: 8px; height: 8px; border-radius: 50%; flex: none; transform: translateY(-1px); }
  </style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" data-t-aria-label="nav.hoofdmenu"></nav>
    <main data-wandinhoud>
      <div class="kop">
        <div>
          <h1 class="kop-1" style="font-size: 40px" data-titel><span data-t="algemeen.laden"></span></h1>
          <div class="periode" data-periode></div>
        </div>
        <div class="wissel" role="group" data-t-aria-label="opbrengst.periode" data-wissel></div>
      </div>
      <div class="links schuift" data-links></div>
      <section class="glas kaart midden"><div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px"><h2 class="kop-3"><span data-t="opbrengst.waarHeen" data-waarheen></span></h2><span class="mini"><span data-t="opbrengst.breedte"></span></span></div><div data-sankey style="margin-top: 6px"></div><div data-gas></div></section>
      <div class="rechts schuift"><section class="glas kaart" data-apparaten></section><section class="glas kaart" data-perdag></section></div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <div class="wissel" role="group" data-t-aria-label="opbrengst.periode" data-wissel></div>
      <div class="periode" data-periode></div>
      <h1 class="kop-1" style="font-size: 32px" data-titel><span data-t="algemeen.laden"></span></h1>
      <div data-telinhoud style="display: flex; flex-direction: column; gap: 14px"></div>
    </div>
    <nav class="tabs" id="tabs" data-t-aria-label="nav.hoofdmenu"></nav>
  </div>

  <script src="kit/stromen.js"></script>
  <script src="basis.js"></script>
