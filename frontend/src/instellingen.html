<style>
  /*
   * Instellingen (besluit 130; besluit 321: vier tegels, schets
   * Wand-Instellingen-Vier #tegels): de stand als één regel, en vier groepen met
   * hun onderdelen als knoppen. Een zoekveld voor wie weet wat hij zoekt.
   */
  #wand main { display: flex; flex-direction: column; gap: 16px; height: 100%; min-height: 0; }
  .kopregel { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .zoekvak { position: relative; width: 380px; }
  .zoek { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 16px; background: rgb(var(--wit) / 0.06); border: 1px solid var(--glas-rand); color: var(--gedempt); }
  .zoek svg { width: 18px; height: 18px; flex: none; }
  .zoek input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--tekst); font: inherit; font-size: 15px; outline: none; }
  .zoek:focus-within { border-color: rgb(var(--wit) / 0.35); }
  .gevonden { position: absolute; z-index: 10; left: 0; right: 0; top: 54px; padding: 6px; border-radius: 16px; background: #0e1626; border: 1px solid var(--glas-rand); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); }
  .gevonden a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--tekst); text-decoration: none; font-size: 14.5px; font-weight: 600; }
  .gevonden a span { color: var(--gedempt); font-weight: 500; font-size: 13px; }
  .gevonden a:hover, .gevonden a:focus-visible { background: rgb(var(--wit) / 0.08); outline: none; }
  .gevonden p { margin: 8px 12px; font-size: 13.5px; color: var(--gedempt); }

  /* De stand als één regel (schets Wand-Instellingen-Vier, besluit 321): de waaier, wat er nog mist met een knop, en Wat je huis kan. */
  .kan { display: flex; align-items: center; gap: 14px; padding: 8px 18px 8px 10px; }
  .kan .hoever { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; }
  .kan .hoever svg { width: 120px; height: 70px; flex: none; }
  .kan .tekst { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .kan .tekst b { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .kan .tekst .punt { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); }
  .kan .tekst .zin { font-size: 13.5px; color: var(--zacht); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kan .tekst { flex: 1; }
  .kan .pijl { flex: none; font-size: 22px; color: var(--gedempt); }
  .kan .gast { padding: 6px 8px; }
  .doe { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 12px; background: var(--accent); color: var(--op-accent); font-weight: 700; font-size: 13.5px; white-space: nowrap; text-decoration: none; flex: none; }
  .stand { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .stand::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .stand.mis { color: var(--gloed-t); background: rgba(255, 122, 77, 0.12); }

  /* Vier tegels, twee bij twee: de kop gaat naar de groep, de onderdelen zijn knoppen met wat er nu staat. */
  .groepen { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; min-height: 0; }
  .tegel { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
  .tegel.aandacht { border-color: rgba(255, 122, 77, 0.4); }
  .tegel .titel { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; }
  .tegel .titel:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; border-radius: 12px; }
  .tegel .icoon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: rgb(var(--wit) / 0.07); flex: none; }
  .tegel .icoon svg { width: 22px; height: 22px; }
  .tegel .kop { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .tegel h3 { margin: 0; font-family: var(--kop); font-size: 22px; font-weight: 600; }
  .tegel .kop .zin { font-size: 13px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tegel .titel > .pijl { color: var(--gedempt); font-size: 22px; }
  .deelknoppen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start; }
  .deelknop { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 7px 12px 7px 14px; border-radius: 14px; background: rgb(var(--wit) / 0.045); border: 1px solid rgb(var(--wit) / 0.07); color: var(--tekst); text-decoration: none; }
  .deelknop:hover { background: rgb(var(--wit) / 0.08); }
  .deelknop:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .deelknop > span:first-child { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .deelknop b { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deelknop span span { font-size: 12.5px; color: var(--gedempt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deelknop .pijl { color: var(--gedempt); font-size: 18px; }
  .deelknop.mist { grid-column: 1 / -1; border-color: color-mix(in srgb, var(--gloed) 40%, transparent); }
  /* Op de wand noemt de regel bovenaan wat mist; in de tegel is daar geen plek voor. */
  #wand .deelknop.mist { display: none; }
  .deelknop.mist b { color: var(--gloed-t); display: flex; align-items: center; gap: 7px; }
  .deelknop.mist .stip { width: 7px; height: 7px; border-radius: 50%; background: var(--gloed); flex: none; }

  /* De telefoon. */
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .zoekvak { width: auto; }
  #tel .groepen { display: flex; flex-direction: column; }
  #tel .tegel { overflow: visible; padding: 14px 8px 8px; gap: 6px; }
  #tel .tegel .titel { padding: 0 8px 4px; }
  #tel .tegel .kop .zin { white-space: normal; }
  #tel .deelknoppen { grid-template-columns: minmax(0, 1fr); gap: 0; }
  #tel .deelknop { border: 0; border-top: 1px solid rgb(var(--wit) / 0.07); border-radius: 0; background: none; }
  #tel .kan { padding: 8px 12px 8px 8px; flex-wrap: wrap; }
  #tel .kan .hoever svg { width: 96px; height: 56px; }
  #tel .kan .tekst .zin { white-space: normal; }
  #tel .kan .hoever { flex-basis: 100%; }
  #tel .kan .doe { margin-left: auto; }
  /* Jij (besluit 181): je profiel, bovenaan; eerst stond hier alleen Weergave (besluit 164). */
  .jijregel { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: inherit; text-decoration: none; }
  .jijregel > span:not(.jijrondje):not(.pijl) { flex: 1; }
  .jijregel b { display: block; font-size: 16px; }
  .jijregel span span { font-size: 13px; color: var(--gedempt); }
  .jijregel .pijl { color: var(--gedempt); font-size: 18px; }
  .jijrondje { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--op-accent); font-family: var(--kop); font-weight: 700; font-size: 18px; flex: none; }
  .pil.jijpil { height: 48px; padding: 0 16px 0 6px; gap: 10px; color: var(--tekst); text-decoration: none; }
  .jijpil .jijrondje { width: 36px; height: 36px; font-size: 16px; }
</style>
