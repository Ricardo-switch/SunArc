<style>
  /*
   * Bewoners (besluit 147, schets Wand-Bewoners): wie hier woont, op volgorde.
   * De eerste die thuis is, bepaalt het comfort; de hoofdgebruiker staat
   * bovenaan. Links één lijst (besluit 351): de bewoners, wie er nu geldt,
   * dan de gasten en de schermen, en Iemand toevoegen. Rechts het blad van wie
   * je kiest.
   */
  #wand main.bew { display: flex; flex-direction: column; gap: 14px; height: 100%; min-height: 0; }
  .kopregel { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
  .veld2 { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; flex: 1; min-height: 0; }
  .links { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .lijst { padding: 14px 18px; flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .bewoner { display: grid; grid-template-columns: 26px 28px 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; margin: 0 -10px; border-radius: 16px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; width: calc(100% + 20px); }
  .bewoner + .bewoner { border-top: 1px solid rgb(var(--wit) / 0.06); }
  .bewoner.gekozen { background: rgb(var(--wit) / 0.08); }
  .bewoner.sleept { opacity: 0.6; }
  .bewoner:focus-visible { outline: 2px solid var(--tekst); outline-offset: -2px; }
  .greep { color: var(--gedempt); font-size: 16px; letter-spacing: -2px; cursor: grab; touch-action: none; user-select: none; padding: 8px 0; text-align: center; }
  .plek { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; background: rgb(var(--wit) / 0.08); color: var(--zacht); }
  .plek.een { background: var(--zon); color: #0b1424; }
  .gezicht { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--kop); font-weight: 700; font-size: 18px; color: #0b1424; }
  .bewoner b { display: block; font-size: 16px; }
  .bewoner .onder { display: block; font-size: 13px; color: var(--zacht); margin-top: 2px; }
  .labels { display: flex; gap: 6px; justify-content: end; flex-wrap: wrap; }
  .label { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .label.thuis { color: var(--mint-t); background: rgb(var(--mint-k) / 0.12); }
  .label.weg { color: var(--gedempt); background: rgb(var(--wit) / 0.06); }
  .label.geldt { color: var(--zon-t); box-shadow: inset 0 0 0 1px rgb(var(--zon-k) / 0.5); }
  .label.geldt::before { display: none; }
  .uitleg { margin: 8px 0 0; padding-top: 12px; border-top: 1px solid rgb(var(--wit) / 0.06); font-size: 13.5px; color: var(--zacht); line-height: 1.5; }
  /* Gasten en schermen (besluit 351): zonder greep en plek, en wat kleiner. */
  .groepje { margin: 16px 0 2px; font-family: var(--kop); font-size: 15px; font-weight: 600; color: var(--gedempt); }
  .bewoner.los { grid-template-columns: 34px minmax(0, 1fr) auto; padding: 7px 10px; }
  .bewoner.los .gezicht { width: 34px; height: 34px; font-size: 15px; }
  .bewoner.los b { font-size: 15px; }
  .toevoegknop { align-self: start; margin-top: 14px; }
  .toevoegknop[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--tekst); }
  .samenrij { display: flex; gap: 8px; }
  .samenrij select { flex: 1; min-width: 0; }
  .uitleg b { color: var(--tekst); }
  .erbij { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; }
  .qr { width: 92px; height: 92px; border-radius: 12px; background: #eef3f7; padding: 7px; box-sizing: border-box; display: grid; place-items: center; }
  .qr svg { width: 100%; height: 100%; }
  .erbij .klein { color: var(--zacht); }
  .erbij a { color: var(--ijs-t); font-weight: 600; word-break: break-all; }
  .blad { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; }
  .blad .kop { display: flex; align-items: center; gap: 14px; }
  .blad .kop .gezicht { width: 56px; height: 56px; font-size: 24px; }
  .vak { display: flex; flex-direction: column; gap: 6px; }
  .vak > label, .vak > span:first-child { font-size: 13px; font-weight: 600; color: var(--gedempt); }
  .invoer.vast { display: flex; align-items: center; background: rgb(var(--wit) / 0.03); }
  .hint { font-size: 12.5px; color: var(--gedempt); line-height: 1.4; }
  .hint a { color: var(--ijs-t); font-weight: 700; text-decoration: none; }
  .knoppenrij { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
  .knoppenrij .knop { flex: 1; white-space: nowrap; }
  .gevaar { color: var(--gloed-zacht); }
  .fout { min-height: 18px; }
  #tel .inhoud { padding: 18px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
  #tel .lijst { overflow: visible; }
  /* Op de telefoon de labels onder de naam: ernaast bleef er voor de naam één woord per regel over. */
  #tel .bewoner { grid-template-columns: 20px 26px 40px minmax(0, 1fr); gap: 6px 10px; }
  #tel .bewoner .labels { grid-column: 4; justify-content: start; }
  #tel .bewoner.los { grid-template-columns: 34px minmax(0, 1fr); }
  #tel .bewoner.los .labels { grid-column: 2; }
  #tel .bewoner .labels:empty { display: none; }
  #tel .blad { overflow: visible; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" data-t-aria-label="nav.hoofdmenu"></nav>

      <div class="kopregel">
        <div><a class="terugje" href="instellingen.html" style="font-size: 14px; font-weight: 600; color: var(--zacht); text-decoration: none" data-t="jij.terugInstellingen"></a><h1 class="kop-1" style="margin-top: 4px" data-t="instellingen.bewoners"></h1></div>
        <span class="mini" style="max-width: 48ch; text-align: right" data-t="bewoners.uitleg"></span>
      </div>
      <div class="veld2">
        <div class="links">
          <section class="glas lijst" data-lijst data-t-aria-label="bewoners.opVolgorde"></section>
        </div>
        <aside class="glas blad" data-blad aria-live="polite"></aside>
      </div>
    </main>
  </div>
  <div id="tel" class="tel">
    <div class="inhoud">
      <a class="terugje" href="instellingen.html" style="font-size: 14px; font-weight: 600; color: var(--zacht); text-decoration: none" data-t="jij.terugInstellingen"></a>
      <h1 class="kop-1" style="margin: 0" data-t="instellingen.bewoners"></h1>
      <section class="glas lijst" data-lijst data-t-aria-label="bewoners.opVolgorde"></section>
      <aside class="glas blad" data-blad aria-live="polite"></aside>
    </div>
    <nav class="tabs" id="tabs" data-t-aria-label="nav.hoofdmenu"></nav>
  </div>
  <script src="kit/iconen.js"></script>
  <script src="kit/teksten.js"></script>
  <script src="kit/taal.js"></script>
  <script src="kit/nav.js"></script>
  <script src="qrcode.js"></script>
  <script src="basis-meldingen.js"></script>
  <script src="basis.js"></script>
  <script src="bewoners.js"></script>
</body>
</html>
