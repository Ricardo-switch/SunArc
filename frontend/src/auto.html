<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<title>Auto · SunArc</title>
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="basis.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1424">
<link rel="icon" href="icoon-192.png?v=sunarc">
<link rel="apple-touch-icon" href="icoon-192.png?v=sunarc">

<style>
  /*
   * De pagina Auto (besluit 259, stap 2; schets Wand-Auto en Tel-Auto): om te
   * kijken. De auto zelf is de meter: hij vult zich tot zijn lading, met een
   * streep bij de laadgrens. Te openen vanaf de kaart op Thuis en vanaf de
   * auto bij Apparaten; in het menu licht Apparaten op. De laadbeurten (stap
   * 3) staan rechts onder de laadpaal, het advies (stap 4) onder de auto.
   * Laden met de hand komt in de volgende stap.
   */
  #wand main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto minmax(0, 1fr); gap: 16px 18px; height: 100%; min-width: 0; }
  .kop { grid-column: 1 / -1; display: flex; align-items: end; gap: 18px; }
  .terug { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--zacht); text-decoration: none; margin-bottom: 6px; }
  .terug:focus-visible, .autos button:focus-visible, .naar:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .instellen { margin-left: auto; }
  .autos { display: flex; padding: 3px; border-radius: 13px; background: rgb(var(--wit) / 0.06); margin-bottom: 4px; }
  .autos[hidden] { display: none; }
  .autos button { height: 38px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; background: transparent; font: inherit; font-size: 14.5px; font-weight: 600; color: var(--zacht); cursor: pointer; }
  .autos button[aria-pressed='true'] { background: rgb(var(--wit) / 0.14); color: var(--tekst); }
  .autos i { width: 7px; height: 7px; border-radius: 50%; }

  /* De auto groot: hoe vol, wat hij doet, de kabel. */
  [data-held] > .held, [data-held] > .leeg { flex: 1; }
  .held { position: relative; min-height: 0; padding: 22px 26px 18px; border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; }
  .held::before { content: ''; position: absolute; inset: auto -10% -40% -10%; height: 70%; background: radial-gradient(ellipse at 50% 0%, rgba(247, 181, 72, 0.14), transparent 65%); pointer-events: none; }
  .held[data-zon='nee']::before { background: radial-gradient(ellipse at 50% 0%, rgba(111, 211, 255, 0.08), transparent 65%); }
  .boven { position: relative; display: flex; justify-content: space-between; align-items: start; gap: 16px; }
  .stand { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; }
  .stand i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  .stand[data-gloed] i { box-shadow: 0 0 12px currentColor; }
  .vermogen { margin-top: 6px; font-family: var(--kop); font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .vermogen small { font-family: var(--romp); font-size: 15px; font-weight: 600; color: var(--zacht); letter-spacing: 0; margin-left: 6px; }
  .pct { text-align: right; }
  .pct b { display: block; font-family: var(--kop); font-size: 84px; font-weight: 600; line-height: 0.9; letter-spacing: -0.04em; }
  .pct b sup { font-size: 34px; vertical-align: top; margin-left: 2px; letter-spacing: 0; }
  .pct span { font-size: 15px; color: var(--zacht); font-weight: 600; }
  .pct p { margin: 0; max-width: 240px; font-size: 14px; line-height: 1.45; color: var(--zacht); text-align: right; }
  .scene { position: relative; flex: 1; min-height: 0; margin: 0 -26px; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stroomt { animation: stroomt 1.1s linear infinite; }
  @keyframes stroomt { to { stroke-dashoffset: -14; } }
  .sc-stil .stroomt { animation: none; }
  .feiten { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid rgb(var(--wit) / 0.08); padding-top: 14px; }
  .feiten > div { padding: 0 16px; border-left: 1px solid rgb(var(--wit) / 0.08); min-width: 0; }
  .feiten > div:first-child { padding-left: 0; border-left: 0; }
  .feiten small { display: block; font-size: 12px; font-weight: 700; color: var(--gedempt); letter-spacing: 0.04em; text-transform: uppercase; }
  .feiten b { display: block; margin-top: 3px; font-size: 17px; font-weight: 600; }
  .feiten span { font-size: 13px; color: var(--zacht); }
  .feiten a { color: inherit; }
  .zonbalk { height: 5px; margin: 6px 0 4px; border-radius: 3px; background: rgb(var(--wit) / 0.08); overflow: hidden; }
  .zonbalk i { display: block; height: 100%; border-radius: 3px; background: var(--zon); }

  /* Het advies: zon en prijs, alleen wat iets zegt. */
  [data-held] { gap: 14px; }
  .advies { flex: none; padding: 14px 18px; border-radius: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .advies.een { grid-template-columns: 1fr; }
  .advies > div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; }
  .advies .ik { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; }
  .advies .ik svg { width: 19px; height: 19px; }
  .advies .zon .ik { background: rgba(247, 181, 72, 0.14); color: var(--zon); }
  .advies .goedkoop .ik { background: rgba(143, 134, 255, 0.14); color: var(--violet-t); }
  .advies b { display: block; font-size: 14.5px; font-weight: 600; }
  .advies span { font-size: 13px; color: var(--zacht); line-height: 1.4; }

  /* Laden met de hand (stap 5): de regel die het blad opent, en het blad (schets Wand-Auto, Tel-Auto). */
  .ladenregel { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px 20px; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .ladenregel b { display: block; font-size: 16px; font-weight: 600; }
  .ladenregel span:not(.pijl) { font-size: 13px; color: var(--zacht); }
  .ladenregel .pijl { color: var(--gedempt); font-size: 22px; }
  .ladenrij { width: 100%; border: 0; border-top: 1px solid rgb(var(--wit) / 0.07); background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .ladenrij b { color: var(--tekst); }
  .ladenrij:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .ladenregel:focus-visible, .snel:focus-visible { outline: 2px solid var(--tekst); outline-offset: 2px; }
  .advies .snel { margin-top: 8px; height: 34px; padding: 0 14px; border: 0; border-radius: 11px; background: var(--tekst); color: var(--inkt); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .advies .snel:disabled { opacity: 0.5; }
  .laadblad .vraag > span { display: block; font-size: 12px; font-weight: 700; color: var(--gedempt); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
  .laadblad .stroom { display: flex; align-items: center; justify-content: space-between; }
  .laadblad .stroom button { width: 52px; height: 52px; border-radius: 16px; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 24px; cursor: pointer; }
  .laadblad .stroom button:disabled, .laadblad .tot-pct button:disabled { opacity: 0.35; cursor: default; }
  .laadblad .stroom .getal { text-align: center; }
  .laadblad .stroom .getal b { display: block; font-family: var(--kop); font-size: 60px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
  .laadblad .stroom .getal b small { font-size: 26px; margin-left: 4px; letter-spacing: 0; }
  .laadblad .stroom .getal span { font-size: 13px; color: var(--gedempt); }
  .laadblad .schaal { position: relative; height: 12px; border-radius: 6px; background: rgb(154 170 187 / 0.22); margin-top: 10px; }
  .laadblad .schaal i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
  .laadblad .schaal i.zon { background: linear-gradient(90deg, rgba(247, 181, 72, 0.25), rgba(247, 181, 72, 0.7)); }
  .laadblad .schaal i.dicht { background: repeating-linear-gradient(135deg, rgb(var(--wit) / 0.12) 0 4px, transparent 4px 8px); }
  .laadblad .schaal b { position: absolute; top: -5px; width: 4px; height: 22px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 3px rgba(11, 20, 36, 0.8); }
  .laadblad .schaal-as { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11.5px; color: var(--gedempt); }
  .laadblad .schaal-as .zon-t { font-weight: 600; }
  .laadblad .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 12px; background: rgb(var(--wit) / 0.06); }
  .laadblad .seg button { height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--zacht); font: inherit; font-size: 13.5px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .laadblad .seg button[aria-pressed='true'] { background: rgb(var(--wit) / 0.14); color: var(--tekst); }
  .laadblad .seg button:disabled { opacity: 0.35; cursor: default; }
  .laadblad .tot-pct { display: grid; grid-template-columns: 40px 64px 40px minmax(0, 1fr); gap: 10px; align-items: center; margin-top: 8px; }
  .laadblad .tot-pct button { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgb(var(--wit) / 0.08); color: var(--tekst); font-size: 20px; cursor: pointer; }
  .laadblad .tot-pct b { text-align: center; font-family: var(--kop); font-size: 26px; font-weight: 600; }
  .laadblad .tot-pct span { font-size: 12.5px; color: var(--gedempt); line-height: 1.4; }
  .laadblad .kan { margin: 0; }
  /* De balk van de dag (besluit 279): zon over, de prijs per uur, tot wanneer. */
  .laadblad .dagbalk { margin: 4px 0 10px; }
  .laadblad .dagbalk svg { display: block; width: 100%; height: auto; overflow: visible; cursor: pointer; touch-action: manipulation; }
  .laadblad .dagbalk .zonvorm { fill: url(#dagzon); }
  .laadblad .dagbalk .prijs { fill: rgb(154 170 187 / 0.28); }
  .laadblad .dagbalk .prijs.goedkoop { fill: var(--ijs); }
  .laadblad .dagbalk .lijn { stroke: rgb(var(--wit) / 0.18); }
  .laadblad .dagbalk .hand { fill: rgb(var(--wit) / 0.07); stroke: rgb(var(--wit) / 0.55); stroke-width: 1.2; }
  .laadblad .dagbalk .eind { stroke: var(--tekst); stroke-width: 2; }
  .laadblad .dagbalk .eind-pil { fill: var(--tekst); }
  .laadblad .dagbalk .eind-t { fill: var(--inkt); font-size: 10.5px; font-weight: 700; }
  .laadblad .dagbalk .vol { fill: var(--glas-donker, #0e1726); stroke: var(--mint); stroke-width: 2; }
  .laadblad .dagbalk .vol-v { stroke: var(--mint); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .laadblad .dagbalk .nu-l { stroke: var(--tekst); stroke-width: 1.5; stroke-dasharray: 2 3; }
  .laadblad .dagbalk .as { fill: var(--gedempt); font-size: 10.5px; font-weight: 600; }
  .laadblad .dagbalk .as.nu { fill: var(--tekst); }
  .laadblad .dagbalk .legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 11.5px; color: var(--gedempt); }
  /* Op de wand past het blad zonder scrollen: kleiner getal, lagere knoppen, de balk lager. */
  .hand-laag:not(.op-tel) .laadblad .stroom button { width: 44px; height: 44px; }
  .hand-laag:not(.op-tel) .laadblad .stroom .getal b { font-size: 44px; }
  .hand-laag:not(.op-tel) .laadblad .seg button { height: 32px; }
  .hand-laag:not(.op-tel) .laadblad .dagbalk { margin: 0 0 4px; }
  .hand-laag:not(.op-tel) .laadblad .dagbalk .legenda { margin-top: 2px; }
  .hand-laag:not(.op-tel) .laadblad .stroom .getal span { font-size: 12px; }
  .hand-laag:not(.op-tel) .laadblad.hand-blad { gap: 10px; padding-top: 16px; padding-bottom: 16px; }
  .hand-laag:not(.op-tel) .laadblad .hand-hoe { padding: 10px 14px; font-size: 13px; line-height: 1.45; }
  .laadblad .dagbalk .legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .laadblad .kan a { color: var(--zacht); }

  /* Rechts: de laadpaal en wat je instelde. */
  .rechts { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .kaart { padding: 20px 22px; border-radius: 24px; }
  .kaart h2 { margin: 0; font-family: var(--kop); font-size: 24px; font-weight: 600; }
  .kaart .onder { margin: 3px 0 0; font-size: 13.5px; color: var(--zacht); }
  .regel { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-top: 1px solid rgb(var(--wit) / 0.07); font-size: 14.5px; }
  .kaart .regel:first-of-type { margin-top: 12px; }
  .regel span { color: var(--zacht); }
  .regel b { font-weight: 600; text-align: right; }
  .fasen { padding: 11px 0 4px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .fasen > span { display: block; font-size: 14.5px; color: var(--zacht); margin-bottom: 8px; }
  .fase { display: grid; grid-template-columns: 26px minmax(0, 1fr) 52px; gap: 10px; align-items: center; margin-top: 7px; font-size: 13px; }
  .fase em { font-style: normal; font-weight: 700; color: var(--gedempt); }
  .fase b { text-align: right; font-size: 14.5px; font-weight: 600; }
  .fase .fbalk { height: 10px; border-radius: 5px; background: rgb(var(--wit) / 0.07); overflow: hidden; }
  .fase .fbalk i { display: block; height: 100%; border-radius: 5px; }
  .kan { margin: 12px 0 0; font-size: 12.5px; color: var(--gedempt); line-height: 1.45; }

  /* De laadbeurten: samen, en per beurt met zijn deel eigen zon. */
  .beurten .som { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-top: 12px; padding: 10px 0; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .beurten .som small { display: block; font-size: 11.5px; font-weight: 700; color: var(--gedempt); letter-spacing: 0.04em; text-transform: uppercase; }
  .beurten .som b { display: block; margin-top: 2px; font-size: 18px; font-weight: 600; }
  .beurt { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px; gap: 2px 12px; align-items: center; padding: 9px 0 7px; border-top: 1px solid rgb(var(--wit) / 0.07); }
  .beurt b { display: block; font-size: 14.5px; font-weight: 600; }
  .beurt span { font-size: 12.5px; color: var(--zacht); }
  .beurt .kwh, .beurt .eur { text-align: right; font-size: 14.5px; font-weight: 600; color: var(--tekst); }
  .beurt .zonbalk { grid-column: 1 / -1; height: 4px; margin: 3px 0 0; }
  .beurten .meer { margin: 6px 0 0; font-size: 12.5px; color: var(--zacht); }
  .naar { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .naar .pijl { color: var(--gedempt); font-size: 22px; }
  .leeg { padding: 26px 28px; border-radius: 26px; }
  .leeg h2 { margin: 0; font-family: var(--kop); font-size: 26px; font-weight: 600; }
  .leeg p { margin: 8px 0 14px; color: var(--zacht); font-size: 15px; line-height: 1.5; max-width: 560px; }

  /* De telefoon (schets Tel-Auto). */
  #tel .inhoud { padding: 14px 16px 110px; display: flex; flex-direction: column; gap: 12px; }
  #tel .kop { align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  #tel h1 { margin: 0; font-size: 34px; line-height: 1.05; }
  #tel .autos { margin: 0; }
  #tel .autos button { height: 34px; padding: 0 12px; font-size: 13.5px; }
  #tel .held { padding: 16px 16px 14px; border-radius: 24px; }
  #tel .stand { font-size: 14.5px; gap: 8px; }
  #tel .stand i { width: 8px; height: 8px; }
  #tel .vermogen { margin-top: 4px; font-size: 28px; }
  #tel .vermogen small { font-size: 13px; margin-left: 4px; }
  #tel .pct b { font-size: 56px; }
  #tel .pct b sup { font-size: 22px; }
  #tel .pct span { font-size: 12.5px; }
  #tel .pct p { font-size: 13px; max-width: 170px; }
  #tel .scene { flex: none; margin: 4px -16px 0; }
  #tel .scene svg { position: static; display: block; width: 100%; height: auto; }
  #tel .feiten { grid-template-columns: 1fr 1fr; gap: 12px 0; padding-top: 12px; }
  #tel .feiten > div:nth-child(3) { grid-column: 1 / -1; padding-left: 0; border-left: 0; }
  #tel .feiten small { font-size: 11px; }
  #tel .feiten b { font-size: 15px; margin-top: 2px; }
  #tel .feiten span { font-size: 12.5px; }
  #tel .kaart { padding: 16px; border-radius: 20px; }
  #tel .advies { grid-template-columns: 1fr; gap: 14px; padding: 14px 16px; }
  #tel .kaart h2 { font-size: 21px; }
  #tel .leeg { padding: 18px; border-radius: 20px; }
  #tel .leeg h2 { font-size: 22px; }
</style>
</head>
<body class="lucht lucht-dag">
  <div id="wand" class="wand">
    <nav class="balk" id="balk" data-t-aria-label="nav.hoofdmenu"></nav>
    <main data-wandinhoud>
      <div class="kop">
        <div>
          <a class="terug" href="apparaten.html">‹ <span data-t="nav.apparaten"></span></a>
          <h1 class="kop-1" data-t="auto.titel"></h1>
        </div>
        <div class="autos" role="group" data-t-aria-label="auto.kies" data-autos hidden></div>
        <a class="terug instellen" href="energie.html#auto"><span data-t="auto.instellen"></span> ›</a>
      </div>
      <div class="held-plek" style="display: flex; flex-direction: column; min-height: 0" data-held></div>
      <div class="rechts" data-rechts></div>
    </main>
  </div>

  <div id="tel" class="tel">
    <div class="inhoud">
      <a class="terug" href="apparaten.html">‹ <span data-t="nav.apparaten"></span></a>
      <div class="kop"><h1 class="kop-1" data-t="auto.titel"></h1><div class="autos" role="group" data-t-aria-label="auto.kies" data-autos hidden></div></div>
      <div data-telinhoud style="display: flex; flex-direction: column; gap: 12px"></div>
    </div>
    <nav class="tabs" id="tabs" data-t-aria-label="nav.hoofdmenu"></nav>
  </div>
  <script src="kit/iconen.js"></script>
  <script src="kit/teksten.nl.js"></script>
  <script src="kit/teksten.en.js"></script>
  <script src="kit/taal.js"></script>
  <script src="kit/nav.js"></script>
  <script src="kit/auto-tekening.js"></script>
  <script src="basis.js"></script>
  <script src="rondleiding.js"></script>
  <script src="auto.js"></script>
</body>
</html>
